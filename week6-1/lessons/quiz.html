<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fetch Self-check Quiz | Abinash</title><style>body{margin:0;background:#f1f5f9;color:#172033;font:16px/1.6 system-ui,sans-serif}main{max-width:820px;margin:2rem auto;padding:1.5rem;background:white;border:1px solid #dbe3ef;border-radius:16px}button,input,select,textarea{font:inherit;padding:.6rem;border:1px solid #94a3b8;border-radius:8px;max-width:100%}button{background:#1d4ed8;color:white;border:0;cursor:pointer}a{color:#1d4ed8}article,.panel{padding:1rem;margin:.75rem 0;background:#eff6ff;border-radius:10px}pre{white-space:pre-wrap;background:#0f172a;color:#e2e8f0;padding:1rem;border-radius:10px;overflow:auto}label{display:block;margin:.6rem 0 .2rem;font-weight:650}img{max-width:160px}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}</style></head><body><main><p><a href="index.html">← Back to this week</a> · <a href="../index.html">Coursework home</a></p><h1>Fetch self-check quiz</h1><form id="quiz"><fieldset><legend>1. What does fetch() return?</legend><label><input type="radio" name="q1" value="a" required> A Promise</label><label><input type="radio" name="q1" value="b"> A JSON object immediately</label></fieldset><fieldset><legend>2. What checks for HTTP 404/500 responses?</legend><label><input type="radio" name="q2" value="a" required> response.ok</label><label><input type="radio" name="q2" value="b"> document.ok</label></fieldset><fieldset><legend>3. Which block handles a rejected Promise in try/catch?</legend><label><input type="radio" name="q3" value="a" required> catch</label><label><input type="radio" name="q3" value="b"> finally only</label></fieldset><button>Check answers</button></form><p id="result" role="status"></p></main><script>document.querySelector("#quiz").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);let score=0;if(f.get("q1")==="a")score++;if(f.get("q2")==="a")score++;if(f.get("q3")==="a")score++;document.querySelector("#result").textContent="You scored "+score+" out of 3. "+(score===3?"Excellent!":"Review the explanations and try again.");};</script></body></html>

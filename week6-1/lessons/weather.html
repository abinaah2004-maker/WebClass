<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seoul Weather | Abinash</title><style>body{margin:0;background:#f1f5f9;color:#172033;font:16px/1.6 system-ui,sans-serif}main{max-width:820px;margin:2rem auto;padding:1.5rem;background:white;border:1px solid #dbe3ef;border-radius:16px}button,input,select,textarea{font:inherit;padding:.6rem;border:1px solid #94a3b8;border-radius:8px;max-width:100%}button{background:#1d4ed8;color:white;border:0;cursor:pointer}a{color:#1d4ed8}article,.panel{padding:1rem;margin:.75rem 0;background:#eff6ff;border-radius:10px}pre{white-space:pre-wrap;background:#0f172a;color:#e2e8f0;padding:1rem;border-radius:10px;overflow:auto}label{display:block;margin:.6rem 0 .2rem;font-weight:650}img{max-width:160px}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}</style></head><body><main><p><a href="index.html">← Back to this week</a> · <a href="../index.html">Coursework home</a></p><h1>Seoul weather demo</h1><p>This demo fetches current weather from Open-Meteo. It needs an internet connection.</p><button id="load">Load Seoul weather</button><p id="status" role="status">Ready.</p><section id="weather" class="panel" hidden><h2 id="temp"></h2><p id="details"></p></section></main><script>document.querySelector("#load").onclick=async()=>{const s=document.querySelector("#status"),w=document.querySelector("#weather");s.textContent="Loading…";w.hidden=true;try{const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current=temperature_2m,relative_humidity_2m,wind_speed_10m");if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json();document.querySelector("#temp").textContent="Temperature: "+d.current.temperature_2m+" "+d.current_units.temperature_2m;document.querySelector("#details").textContent="Humidity: "+d.current.relative_humidity_2m+"% · Wind: "+d.current.wind_speed_10m+" "+d.current_units.wind_speed_10m;s.textContent="Weather loaded.";w.hidden=false;}catch(e){s.textContent="Could not load weather. Check your connection. "+e.message;}};</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Random User Cards | Abinash</title><style>body{margin:0;background:#f1f5f9;color:#172033;font:16px/1.6 system-ui,sans-serif}main{max-width:820px;margin:2rem auto;padding:1.5rem;background:white;border:1px solid #dbe3ef;border-radius:16px}button,input,select,textarea{font:inherit;padding:.6rem;border:1px solid #94a3b8;border-radius:8px;max-width:100%}button{background:#1d4ed8;color:white;border:0;cursor:pointer}a{color:#1d4ed8}article,.panel{padding:1rem;margin:.75rem 0;background:#eff6ff;border-radius:10px}pre{white-space:pre-wrap;background:#0f172a;color:#e2e8f0;padding:1rem;border-radius:10px;overflow:auto}label{display:block;margin:.6rem 0 .2rem;font-weight:650}img{max-width:160px}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}</style></head><body><main><p><a href="index.html">← Back to this week</a> · <a href="../index.html">Coursework home</a></p><h1>Random user profile cards</h1><p>Load three sample profiles from the Random User API.</p><button id="load">Generate profiles</button><p id="status" role="status">Ready.</p><section id="cards"></section></main><script>document.querySelector("#load").onclick=async()=>{const s=document.querySelector("#status"),cards=document.querySelector("#cards");s.textContent="Loading…";cards.replaceChildren();try{const r=await fetch("https://randomuser.me/api/?results=3");if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json();d.results.forEach(u=>{const card=document.createElement("article");const img=document.createElement("img");img.src=u.picture.medium;img.alt="";const h=document.createElement("h2");h.textContent=u.name.first+" "+u.name.last;const p=document.createElement("p");p.textContent=u.email+" · "+u.location.country;card.append(img,h,p);cards.append(card);});s.textContent="Three profiles loaded.";}catch(e){s.textContent="Could not load profiles. "+e.message;}};</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Joke Lab | Abinash</title>
<style>
body{font:16px/1.6 system-ui,sans-serif;margin:0;background:#f1f5f9;color:#172033}main{max-width:760px;margin:2rem auto;padding:1.5rem;background:white;border-radius:16px;border:1px solid #dbe3ef}button{font:inherit;padding:.6rem .9rem;border:0;border-radius:8px;background:#1d4ed8;color:white;cursor:pointer;margin:.2rem}a{color:#1d4ed8}.card{background:#eff6ff;padding:1rem;border-radius:10px;margin:1rem 0}button:focus-visible,a:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}
</style></head><body><main><p><a href="../index.html">← Week 6 API projects</a> · <a href="../../index.html">Coursework home</a></p><h1>Joke Lab</h1><p>Load a random joke from a public API and save favourites in this browser.</p><button id="load">Get a joke</button><p id="status" role="status">Ready.</p><article id="joke" class="card" hidden><p id="setup"></p><p id="punchline"></p><button id="save">Save favourite</button></article><h2>Saved favourites</h2><section id="favourites"></section></main><script>
const status=document.querySelector("#status"),jokeBox=document.querySelector("#joke"),setup=document.querySelector("#setup"),punchline=document.querySelector("#punchline"),favourites=document.querySelector("#favourites");let current=null;let saved=JSON.parse(localStorage.getItem("abinashJokes")||"[]");
function renderSaved(){favourites.replaceChildren();if(!saved.length){favourites.textContent="No favourites saved yet.";return;}saved.forEach((j,i)=>{const card=document.createElement("article");card.className="card";const p=document.createElement("p");p.textContent=j.setup+" — "+j.punchline;const b=document.createElement("button");b.textContent="Remove";b.onclick=()=>{saved.splice(i,1);localStorage.setItem("abinashJokes",JSON.stringify(saved));renderSaved();};card.append(p,b);favourites.append(card);});}
document.querySelector("#load").onclick=async()=>{status.textContent="Loading a joke…";jokeBox.hidden=true;try{const r=await fetch("https://official-joke-api.appspot.com/random_joke");if(!r.ok)throw new Error("HTTP "+r.status);const data=await r.json();current={setup:data.setup,punchline:data.punchline};setup.textContent=current.setup;punchline.textContent=current.punchline;jokeBox.hidden=false;status.textContent="Joke loaded.";}catch(e){status.textContent="Could not load a joke. Check your internet connection. "+e.message;}};
document.querySelector("#save").onclick=()=>{if(!current)return;if(!saved.some(j=>j.setup===current.setup&&j.punchline===current.punchline)){saved.push(current);localStorage.setItem("abinashJokes",JSON.stringify(saved));renderSaved();status.textContent="Saved to favourites.";}else status.textContent="This joke is already saved.";};renderSaved();
</script></body></html>

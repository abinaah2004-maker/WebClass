<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Country Explorer | Abinash</title><style>body{margin:0;background:#f1f5f9;color:#172033;font:16px/1.6 system-ui,sans-serif}main{max-width:820px;margin:2rem auto;padding:1.5rem;background:white;border:1px solid #dbe3ef;border-radius:16px}button,input,select,textarea{font:inherit;padding:.6rem;border:1px solid #94a3b8;border-radius:8px;max-width:100%}button{background:#1d4ed8;color:white;border:0;cursor:pointer}a{color:#1d4ed8}article,.panel{padding:1rem;margin:.75rem 0;background:#eff6ff;border-radius:10px}pre{white-space:pre-wrap;background:#0f172a;color:#e2e8f0;padding:1rem;border-radius:10px;overflow:auto}label{display:block;margin:.6rem 0 .2rem;font-weight:650}img{max-width:160px}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}</style></head><body><main><p><a href="index.html">← Back to this week</a> · <a href="../index.html">Coursework home</a></p><h1>Country explorer</h1><p>Search for a country and view its flag, capital, population, and region.</p><form id="form"><label for="country">Country</label><input id="country" required value="South Korea"><button>Search</button></form><p id="status" role="status">Ready.</p><article id="result" hidden><img id="flag" alt=""><h2 id="name"></h2><p id="capital"></p><p id="population"></p><p id="region"></p></article></main><script>document.querySelector("#form").onsubmit=async e=>{e.preventDefault();const q=document.querySelector("#country").value.trim(),s=document.querySelector("#status"),box=document.querySelector("#result");s.textContent="Searching…";box.hidden=true;try{const r=await fetch("https://restcountries.com/v3.1/name/"+encodeURIComponent(q)+"?fields=name,capital,population,region,flags");if(!r.ok)throw new Error("Country not found (HTTP "+r.status+").");const d=(await r.json())[0];document.querySelector("#flag").src=d.flags.svg||d.flags.png;document.querySelector("#flag").alt="Flag of "+d.name.common;document.querySelector("#name").textContent=d.name.common;document.querySelector("#capital").textContent="Capital: "+(d.capital||["Not listed"]).join(", ");document.querySelector("#population").textContent="Population: "+Number(d.population).toLocaleString();document.querySelector("#region").textContent="Region: "+d.region;box.hidden=false;s.textContent="Country loaded.";}catch(err){s.textContent=err.message+" Check the spelling or connection.";}};</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pokémon Explorer | Abinash</title><style>body{margin:0;background:#f1f5f9;color:#172033;font:16px/1.6 system-ui,sans-serif}main{max-width:820px;margin:2rem auto;padding:1.5rem;background:white;border:1px solid #dbe3ef;border-radius:16px}button,input,select,textarea{font:inherit;padding:.6rem;border:1px solid #94a3b8;border-radius:8px;max-width:100%}button{background:#1d4ed8;color:white;border:0;cursor:pointer}a{color:#1d4ed8}article,.panel{padding:1rem;margin:.75rem 0;background:#eff6ff;border-radius:10px}pre{white-space:pre-wrap;background:#0f172a;color:#e2e8f0;padding:1rem;border-radius:10px;overflow:auto}label{display:block;margin:.6rem 0 .2rem;font-weight:650}img{max-width:160px}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}</style></head><body><main><p><a href="index.html">← Back to this week</a> · <a href="../index.html">Coursework home</a></p><h1>Pokémon explorer</h1><p>Search by Pokémon name or Pokédex number (for example, pikachu or 25).</p><form id="form"><input id="pokemon" required value="pikachu" aria-label="Pokémon name or number"><button>Search</button></form><p id="status" role="status">Ready.</p><article id="result" hidden><img id="sprite" alt=""><h2 id="name"></h2><p id="types"></p><p id="stats"></p></article></main><script>document.querySelector("#form").onsubmit=async e=>{e.preventDefault();const q=document.querySelector("#pokemon").value.trim().toLowerCase(),s=document.querySelector("#status"),box=document.querySelector("#result");s.textContent="Searching…";box.hidden=true;try{const r=await fetch("https://pokeapi.co/api/v2/pokemon/"+encodeURIComponent(q));if(!r.ok)throw new Error("No Pokémon found (HTTP "+r.status+").");const d=await r.json();document.querySelector("#sprite").src=d.sprites.front_default||"";document.querySelector("#sprite").alt="Sprite of "+d.name;document.querySelector("#name").textContent=d.name[0].toUpperCase()+d.name.slice(1)+" (#"+d.id+")";document.querySelector("#types").textContent="Types: "+d.types.map(t=>t.type.name).join(", ");document.querySelector("#stats").textContent=d.stats.map(x=>x.stat.name+": "+x.base_stat).join(" · ");box.hidden=false;s.textContent="Loaded successfully.";}catch(err){s.textContent=err.message+" Check spelling and internet connection.";}};</script></body></html>

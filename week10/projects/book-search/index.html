<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Search books using the Open Library API."><title>Book Search | Abinash Lamichhane</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#edf2f7;background:#0c1119;--panel:#151e2b;--line:#2a394b;--muted:#9cabbc;--lime:#b7f36b;--cyan:#8dd8ce}*{box-sizing:border-box}body{margin:0;line-height:1.55}a{color:var(--lime);text-decoration:none}.wrap{max-width:1080px;margin:auto;padding:28px 22px 70px}.top{display:flex;justify-content:space-between;gap:1rem;align-items:center;border-bottom:1px solid var(--line);padding:12px 0 22px}.top a{font-weight:700}.tag{font-size:.72rem;letter-spacing:.15em;color:var(--cyan);font-weight:800}h1{font-size:clamp(2.5rem,7vw,4.7rem);line-height:1;letter-spacing:-.06em;margin:2.4rem 0 .8rem}h2{letter-spacing:-.03em}.intro{color:var(--muted);max-width:680px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#1b2938;border:1px solid var(--line);padding:15px;border-radius:12px}.stat small{color:var(--muted);display:block}.stat strong{font-size:1.5rem}.form-row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.field{background:#0d1520;color:#edf2f7;border:1px solid #3a4b5e;border-radius:8px;padding:11px;min-width:0;flex:1}button,.btn{background:var(--lime);color:#14200f;border:0;border-radius:8px;padding:11px 15px;font-weight:800;cursor:pointer}button.secondary,.btn.secondary{background:transparent;border:1px solid var(--line);color:#edf2f7}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}.list{display:grid;gap:9px}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:10px;background:#101925}.item small{display:block;color:var(--muted)}.muted{color:var(--muted)}.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:10px}.book{display:grid;grid-template-columns:70px 1fr;gap:14px;padding:14px;border:1px solid var(--line);border-radius:10px;margin:10px 0}.cover{width:70px;height:100px;object-fit:cover;background:#253448;border-radius:4px}.cover-placeholder{width:70px;height:100px;display:grid;place-items:center;background:#263747;color:var(--cyan);border-radius:4px}.small{font-size:.86rem;color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><header class="top"><a href="../../">← Week 10 coursework</a><span class="tag">PERSONAL PROJECT / 2026</span></header><p class="tag">API PROJECT / OPEN LIBRARY</p><h1>Book Search<span style="color:var(--lime)">.</span></h1><p class="intro">Search books using the public Open Library Search API. Try a title, author or subject. This project demonstrates asynchronous requests and loading, empty and error states.</p><section class="panel"><form id="searchForm"><div class="form-row"><input class="field" id="query" type="search" placeholder="Search a book or author (e.g. Clean Code)" required><button>Search books</button></div></form><p id="status" class="small" role="status" aria-live="polite">Enter a search term to begin.</p></section><section id="results" aria-label="Search results"></section></main><script>const form=document.getElementById('searchForm'),query=document.getElementById('query'),status=document.getElementById('status'),results=document.getElementById('results');form.addEventListener('submit',async e=>{e.preventDefault();const q=query.value.trim();if(!q)return;status.textContent='Searching Open Library…';results.innerHTML='';try{const url='https://openlibrary.org/search.json?q='+encodeURIComponent(q)+'&limit=12';const response=await fetch(url);if(!response.ok)throw new Error('The book service returned an error ('+response.status+').');const data=await response.json();const docs=data.docs||[];if(!docs.length){status.textContent='No books found. Try another title or author.';return}status.textContent='Showing '+docs.length+' results.';docs.forEach(book=>{const card=document.createElement('article');card.className='book';const cover=document.createElement('div');if(book.cover_i){const img=document.createElement('img');img.className='cover';img.alt='Book cover for '+(book.title||'this book');img.loading='lazy';img.src='https://covers.openlibrary.org/b/id/'+book.cover_i+'-M.jpg';cover.append(img)}else{cover.className='cover-placeholder';cover.textContent='BOOK'}const info=document.createElement('div');const h=document.createElement('h3');h.textContent=book.title||'Untitled';const author=document.createElement('p');author.className='small';author.textContent='By '+(book.author_name||['Unknown author']).slice(0,3).join(', ');const year=document.createElement('p');year.className='small';year.textContent='First published: '+(book.first_publish_year||'Not listed');const link=document.createElement('a');link.href='https://openlibrary.org'+(book.key||'');link.target='_blank';link.rel='noopener noreferrer';link.textContent='View on Open Library ↗';info.append(h,author,year,link);card.append(cover,info);results.append(card)})}catch(error){status.textContent='Unable to load books. Check your internet connection and try again. Details: '+error.message;}});</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="StudyHub DOM and event practice project by Abinash Lamichhane."><title>StudyHub · DOM & Events</title><style>
:root{font-family:system-ui,sans-serif;background:#0b1220;color:#edf4ff;line-height:1.5}*{box-sizing:border-box}body{margin:0;padding:22px}.wrap{max-width:950px;margin:auto}.panel{background:#131f33;border:1px solid #293b57;border-radius:16px;padding:20px;margin:14px 0}h1{margin-bottom:4px}p{color:#b6c7dc}input,button,select{font:inherit;padding:10px;border-radius:8px;border:1px solid #405573}input,select{background:#0c1728;color:white}button{background:#77dcff;color:#062032;font-weight:700;cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}li{padding:8px;margin:5px 0;background:#1a2a43;border-radius:8px}.done{text-decoration:line-through;opacity:.65}.muted{font-size:.9rem}@media(max-width:600px){body{padding:10px}.panel{padding:14px}}
</style></head><body><main class="wrap"><header class="panel"><p>WEB PROGRAMMING · PRACTICE PROJECT</p><h1>StudyHub</h1><p>Abinash Lamichhane · Practice DOM selection, events, filtering, and local storage.</p></header>
<section class="panel"><h2>Task manager</h2><form id="task-form" class="row"><label><span class="muted">New task</span><br><input id="task-input" required maxlength="90" placeholder="e.g. Review JavaScript"></label><label><span class="muted">Category</span><br><select id="task-category"><option>Study</option><option>Work</option><option>Personal</option></select></label><button type="submit">Add task</button></form><div class="row" style="margin-top:12px"><button type="button" data-filter="all">All</button><button type="button" data-filter="open">To do</button><button type="button" data-filter="done">Completed</button><button type="button" id="clear-done">Clear completed</button></div><p id="task-count" aria-live="polite">0 tasks</p><ul id="task-list"></ul></section>
<section class="panel"><h2>Student search</h2><label for="student-search">Search the sample student list</label><br><input id="student-search" placeholder="Type a name"><ul id="student-results"></ul></section>
<section class="panel"><h2>Attendance tracker</h2><div class="row"><label>Class name <input id="class-name" placeholder="Web Programming"></label><button id="mark-attendance" type="button">Mark present</button></div><p id="attendance" aria-live="polite">No attendance recorded in this session.</p></section><p><a href="../index.html" style="color:#77dcff">← Back to coursework</a></p></main>
<script>
const $=s=>document.querySelector(s);let tasks=JSON.parse(localStorage.getItem('studyhub-tasks')||'[]'),filter='all';const students=['Abinash Lamichhane','Computer Engineering','Web Programming','JavaScript Practice','Study Group'];
function render(){const list=$('#task-list');list.replaceChildren();tasks.filter(t=>filter==='all'||(filter==='done'?t.done:!t.done)).forEach(t=>{const li=document.createElement('li');const label=document.createElement('label');const cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;cb.addEventListener('change',()=>{t.done=cb.checked;save()});label.append(cb,document.createTextNode(' '+t.text+' · '+t.category));if(t.done)label.classList.add('done');const del=document.createElement('button');del.textContent='Delete';del.type='button';del.style.marginLeft='10px';del.addEventListener('click',()=>{tasks=tasks.filter(x=>x.id!==t.id);save()});li.append(label,del);list.append(li)});$('#task-count').textContent=tasks.filter(t=>!t.done).length+' open · '+tasks.filter(t=>t.done).length+' completed';}
function save(){localStorage.setItem('studyhub-tasks',JSON.stringify(tasks));render()}$('#task-form').addEventListener('submit',e=>{e.preventDefault();tasks.push({id:Date.now(),text:$('#task-input').value.trim(),category:$('#task-category').value,done:false});$('#task-input').value='';save()});document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;render()}));$('#clear-done').addEventListener('click',()=>{tasks=tasks.filter(t=>!t.done);save()});
function showStudents(){const q=$('#student-search').value.toLowerCase();const ul=$('#student-results');ul.replaceChildren();students.filter(s=>s.toLowerCase().includes(q)).forEach(s=>{const li=document.createElement('li');li.textContent=s;ul.append(li)});if(!ul.children.length){const li=document.createElement('li');li.textContent='No matches found';ul.append(li)}}$('#student-search').addEventListener('input',showStudents);$('#mark-attendance').addEventListener('click',()=>{$('#attendance').textContent='Present marked for '+($('#class-name').value.trim()||'the selected class')+' at '+new Date().toLocaleTimeString()+'.'});render();showStudents();
</script></body></html>

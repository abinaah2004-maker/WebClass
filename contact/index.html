<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Accessible contact form practice by Abinash Lamichhane."><title>Contact · Coursework Practice</title><style>
:root{font-family:system-ui,sans-serif;background:#f1f5f9;color:#172033;line-height:1.55}*{box-sizing:border-box}body{margin:0;padding:24px}.wrap{max-width:700px;margin:auto;background:white;padding:26px;border-radius:16px;border:1px solid #d8e1ec}label{display:block;font-weight:700;margin:14px 0 5px}input,select,textarea,button{width:100%;font:inherit;padding:11px;border:1px solid #aab9cb;border-radius:8px}textarea{min-height:130px;resize:vertical}button{margin-top:16px;background:#075985;color:white;font-weight:700;cursor:pointer}input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid #38bdf8;outline-offset:2px}.hint{color:#52657a;font-size:.9rem}#status{padding:10px;border-radius:8px}a{color:#0369a1}
</style></head><body><main class="wrap"><p>WEB PROGRAMMING · FORM VALIDATION</p><h1>Contact Form</h1><p>A practice form by Abinash Lamichhane. Native browser validation checks required fields and email format.</p><form id="contact-form"><label for="name">Full name *</label><input id="name" name="name" autocomplete="name" required minlength="2" maxlength="80"><label for="email">Email address *</label><input id="email" name="email" type="email" autocomplete="email" required><label for="topic">Topic</label><select id="topic" name="topic"><option>Coursework question</option><option>Project feedback</option><option>Other</option></select><label for="message">Message *</label><textarea id="message" name="message" required minlength="10" maxlength="1000" aria-describedby="message-help"></textarea><p class="hint" id="message-help">Write at least 10 characters. Maximum 1,000 characters.</p><button type="submit">Validate message</button></form><p id="status" role="status" aria-live="polite"></p><p class="hint">Demo only: this form does not send data to a server.</p><a href="../index.html">← Back to coursework</a></main><script>document.querySelector('#contact-form').addEventListener('submit',e=>{e.preventDefault();const form=e.currentTarget;if(!form.reportValidity())return;document.querySelector('#status').textContent='Form validated successfully. This demo does not send or store your message.';form.reset()});</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loops & Arrays | Abinash</title><style>
body{margin:0;background:#f1f5f9;color:#172033;font:16px/1.6 system-ui,sans-serif}main{max-width:760px;margin:2rem auto;padding:1.5rem;background:white;border:1px solid #dbe3ef;border-radius:16px}label{display:block;font-weight:700;margin:.6rem 0}input,button{font:inherit;padding:.6rem;border-radius:8px}input{border:1px solid #94a3b8;width:100%;max-width:220px}button{border:0;background:#2563eb;color:white;cursor:pointer}pre{white-space:pre-wrap;background:#0f172a;color:#e2e8f0;padding:1rem;border-radius:10px;min-height:4rem}a{color:#1d4ed8}</style></head><body><main><p><a href="index.html">← Week 5</a></p><h1>Task 2: Loops and arrays</h1><p>Choose a maximum number to generate a sequence and calculate its total.</p><label for="max">Count from 1 to</label><input id="max" type="number" min="1" max="100" value="10"><button id="run">Run loop</button><h2>Output</h2><pre id="output" aria-live="polite">Click “Run loop” to begin.</pre><h2>Array loop example</h2><p>Subjects: HTML, CSS, JavaScript, and Accessibility.</p><pre id="array-output"></pre></main><script>
const output=document.querySelector("#output");document.querySelector("#run").addEventListener("click",()=>{const n=Number(document.querySelector("#max").value);if(!Number.isInteger(n)||n<1||n>100){output.textContent="Choose a whole number from 1 to 100.";return;}const numbers=[];let total=0;for(let i=1;i<=n;i++){numbers.push(i);total+=i;}output.textContent="Numbers: "+numbers.join(", ")+"\nTotal: "+total+"\nCount: "+numbers.length;});
const subjects=["HTML","CSS","JavaScript","Accessibility"];let lines=[];for(const subject of subjects){lines.push("• "+subject);}document.querySelector("#array-output").textContent=lines.join("\n");
</script></body></html>

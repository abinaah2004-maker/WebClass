<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grade Checker | Abinash</title><style>
body{margin:0;background:#f1f5f9;color:#172033;font:16px/1.6 system-ui,sans-serif}main{max-width:680px;margin:3rem auto;padding:1.5rem;background:white;border:1px solid #dbe3ef;border-radius:16px}label{display:block;font-weight:700;margin:.75rem 0 .25rem}input,button{font:inherit;padding:.65rem;border-radius:8px}input{width:100%;border:1px solid #94a3b8}button{margin-top:1rem;border:0;background:#2563eb;color:white;cursor:pointer}#result{margin-top:1rem;padding:1rem;background:#eff6ff;border-radius:10px;min-height:2rem}a{color:#1d4ed8}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}</style></head><body><main><p><a href="index.html">← Week 5</a></p><h1>Task 1: Grade checker</h1><p>Enter a score from 0 to 100. This exercise demonstrates validation and if/else logic.</p><form id="grade-form"><label for="score">Exam score</label><input id="score" type="number" min="0" max="100" step="1" required placeholder="e.g. 86"><button type="submit">Check grade</button></form><section id="result" aria-live="polite">Your result will appear here.</section><h2>How it works</h2><p>The script checks the input range first, then selects a grade using an if/else if chain.</p></main><script>
const form=document.querySelector("#grade-form");const scoreInput=document.querySelector("#score");const result=document.querySelector("#result");
form.addEventListener("submit",event=>{event.preventDefault();const score=Number(scoreInput.value);if(scoreInput.value.trim()===""||!Number.isFinite(score)||score<0||score>100){result.textContent="Please enter a valid score from 0 to 100.";return;}let grade,feedback;if(score>=90){grade="A";feedback="Excellent work!";}else if(score>=80){grade="B";feedback="Very good work."; }else if(score>=70){grade="C";feedback="Good effort—keep practising."; }else if(score>=60){grade="D";feedback="You passed, but review the topics."; }else{grade="F";feedback="Review the material and try again."; }result.textContent="Score: "+score+" / 100 · Grade: "+grade+". "+feedback;});
</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Week 12 Monday React state and useState exercises by Abinash Lamichhane.">
<meta name="theme-color" content="#f4f0e7">
<title>Week 12 · React State | Abinash Lamichhane</title>
<style>
:root{color-scheme:light;--paper:#f4f0e7;--white:#fffdf8;--ink:#17243a;--muted:#657083;--line:#d8d2c6;--accent:#e45d42;--blue:#315b83;--mint:#dce9e1;font:16px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink)}a{color:var(--blue);text-underline-offset:3px}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:#fffdf8;padding:10px 15px;border-radius:4px;font-weight:700;transition:transform .16s,background .16s}button:hover:not(:disabled){background:var(--accent);border-color:var(--accent);transform:translateY(-1px)}button:disabled{opacity:.35;cursor:not-allowed}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.skip{position:absolute;left:-9999px}.skip:focus{left:14px;top:12px;z-index:10;background:#fff;color:#111;padding:10px}
.shell{width:min(1220px,calc(100% - 44px));margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 0;border-bottom:1px solid var(--ink)}.brand{color:var(--ink);text-decoration:none;font-size:12px;font-weight:900;letter-spacing:.16em}.toplinks{display:flex;gap:22px;flex-wrap:wrap;font-size:13px}.toplinks a{text-decoration:none;font-weight:700}
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(270px,.65fr);gap:42px;align-items:center;padding:64px 0 42px}.eyebrow,.tag{color:var(--accent);font-size:11px;font-weight:900;letter-spacing:.17em;text-transform:uppercase}.hero h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:clamp(54px,8vw,104px);line-height:.9;letter-spacing:-.065em;margin:14px 0 20px}.hero h1 span{color:var(--accent);font-style:italic}.hero p{color:var(--muted);max-width:650px}.hero-card{background:var(--ink);color:#fffdf8;padding:26px 25px 24px;border-radius:3px;box-shadow:10px 10px 0 #e5b7a9}.hero-card h2{font-family:Georgia,serif;font-size:30px;line-height:1.12;margin:7px 0}.hero-card .eyebrow{color:#f0a18c}.hero-card .muted{color:#c4ccd7}.hero-card pre{background:#24364e;border:1px solid #51617a;color:#fff;padding:13px;border-radius:3px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.chip{background:#e9e2d5;color:var(--ink);font-size:12px;font-weight:700;padding:6px 11px;border-left:3px solid var(--accent)}
.progress-wrap{display:flex;justify-content:space-between;gap:12px;margin:14px 0 7px;font-size:13px;font-weight:700;color:var(--muted)}progress{width:100%;height:9px;accent-color:var(--accent)}
.launchpad{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center;padding:22px 24px;margin:8px 0 24px;background:var(--mint);border-left:5px solid var(--blue)}.launchpad h2{font-family:Georgia,serif;font-size:28px;font-weight:500;margin:2px 0}.launchpad p{color:var(--muted);margin:6px 0 12px}.launch-choices{display:grid;grid-template-columns:repeat(3,minmax(125px,1fr));gap:7px}.launch-choices button{font-size:12px;padding:9px 10px;background:transparent;color:var(--ink);border:1px solid #9aaea4;text-align:left}.launch-choices button[aria-pressed=true]{background:var(--blue);color:white;border-color:var(--blue)}
.layout{display:grid;grid-template-columns:1fr;gap:18px;padding:12px 0 52px;scroll-margin-top:16px}.menu{display:block}.menu h2{font-family:Georgia,serif;font-size:25px;font-weight:500;margin:0 0 10px}.menu-list{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.menu button{background:transparent;color:var(--ink);border:1px solid var(--line);text-align:left;min-height:64px;margin:0;padding:10px;font-size:12px;line-height:1.35}.menu button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:white}.content{min-width:0}.content-head{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;padding:16px 0 12px;border-bottom:2px solid var(--ink);margin-bottom:18px}.content-head h2{font-family:Georgia,serif;font-size:36px;font-weight:500;line-height:1.05;margin:0}.content-head .eyebrow{margin:0 0 5px}
.exercise-card{background:var(--white);border:1px solid var(--line);padding:clamp(18px,3vw,30px);box-shadow:0 8px 24px #17243a0a}.exercise-card h3{font-family:Georgia,serif;font-size:27px;font-weight:500;margin:0 0 8px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:13px}.product,.mini-card{background:#fff;border:1px solid var(--line);border-radius:3px;padding:15px;min-width:0}.product img{display:block;width:100%;height:145px;object-fit:contain;background:#f2eee6;border-bottom:1px solid var(--line);padding:8px}.product h4{font-size:15px;line-height:1.35;margin:12px 0 4px}.product p{color:var(--accent);font-weight:800;margin:4px 0 12px}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.controls button{font-size:13px}.shop-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;align-items:start}.cart{position:sticky;top:14px;background:#edf1ed;border:1px solid #c8d4cc;padding:18px;border-top:4px solid var(--blue)}.cart h3{font-family:Georgia,serif;font-size:26px;font-weight:500;margin:0 0 10px}.cart ul{padding-left:18px}.cart li{margin:12px 0}.field{display:block;margin:10px 0;color:var(--muted);font-size:13px;font-weight:700}input[type=text],input[type=number],textarea,select{width:100%;padding:11px;border:1px solid #b8c0c5;border-radius:3px;background:#fff;color:var(--ink)}input[type=range]{width:100%;accent-color:var(--accent)}textarea{resize:vertical}.score{font-family:Georgia,serif;font-size:42px;font-weight:500;color:var(--accent);margin:8px 0}.status{padding:11px 13px;background:#f8e5df;color:#873a2a;border-left:3px solid var(--accent)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f0ede6;border:1px solid var(--line);padding:14px;color:var(--ink);font-size:13px}.task-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding:11px 0}.task-row label{flex:1}.done{text-decoration:line-through;color:var(--muted)}.footer{padding:24px 0 42px;border-top:1px solid var(--ink);color:var(--muted);font-size:12px}
@media(max-width:900px){.launchpad{grid-template-columns:1fr}.launch-choices{grid-template-columns:repeat(3,minmax(0,1fr))}.menu-list{grid-template-columns:repeat(3,minmax(0,1fr))}.shop-layout{grid-template-columns:minmax(0,1fr) 260px}}
@media(max-width:650px){.shell{width:min(100% - 28px,1220px)}.topbar{align-items:flex-start;flex-direction:column}.hero{grid-template-columns:1fr;padding:40px 0 28px;gap:22px}.hero h1{font-size:clamp(54px,16vw,82px)}.launch-choices{grid-template-columns:repeat(2,minmax(0,1fr))}.menu-list{grid-template-columns:repeat(2,minmax(0,1fr))}.shop-layout{grid-template-columns:1fr}.cart{position:static}.content-head h2{font-size:30px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<div id="root"><main class="shell" id="main"><p>Loading the React exercises…</p></main></div>
<noscript><p>JavaScript is required for the interactive React exercises.</p></noscript>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.10/babel.min.js" crossorigin></script>
<script type="text/babel" data-presets="react">
const {useState}=React;
const money=new Intl.NumberFormat('en-KR',{style:'currency',currency:'KRW',maximumFractionDigits:0});
const gear=[
{id:1,name:'Marshall Monitor III A.N.C.',price:449000,image:'https://www.fujiya-avic.co.jp/img/goods/1/200000069895_1.jpg',group:'Audio'},
{id:2,name:'Acer Predator Helios 16',price:2390000,image:'https://cdn.gamenotebaku.az/productimg/111/530/gamenote_img_16_1718911127.png.webp',group:'Computers'},
{id:3,name:'13-inch iPad Pro (M5)',price:1990000,image:'https://lcdn.altex.ro/media/catalog/product/i/p/ipad_pro_13inch_m5_wifi_space_black_2_1fc50113.jpg',group:'Mobile'},
{id:4,name:'iPhone 17 Pro Max (Silver)',price:1990000,image:'https://www.aucklanddutyfree.co.nz/media/catalog/product/1/0/101506045_0_45d6.jpg?width=800',group:'Mobile'},
{id:5,name:'16-inch MacBook Pro (M5 Max)',price:5490000,image:'https://www.svacampusstore.com/cdn/shop/files/mbp16-silver-select-202603_5cad1269-b08d-453e-bb9c-242dabb96fb2.png?v=1772557311&width=1000',group:'Computers'}
];
const sections=[['builder','Tech Desk Builder'],['counter','Counter & History'],['score','Two-player Scoreboard'],['words','Live Word Count'],['tips','React Quick Tips'],['queue','Study Queue']];
function Builder(){
 const [items,setItems]=useState([]),[group,setGroup]=useState('All gear'),[budget,setBudget]=useState(4000000);
 const visible=gear.filter(p=>group==='All gear'||p.group===group);
 const total=items.reduce((s,p)=>s+p.price*p.quantity,0),remaining=budget-total;
 function add(product){setItems(old=>{const found=old.find(p=>p.id===product.id);return found?old.map(p=>p.id===product.id?{...p,quantity:p.quantity+1}:p):[...old,{...product,quantity:1}]})}
 function change(id,delta){setItems(old=>old.map(p=>p.id===id?{...p,quantity:p.quantity+delta}:p).filter(p=>p.quantity>0))}
 function preset(ids){setItems(old=>{const next=[...old];ids.forEach(id=>{const p=gear.find(x=>x.id===id),i=next.findIndex(x=>x.id===id);if(i<0)next.push({...p,quantity:1})});return next})}
 return <section className="exercise-card"><p className="eyebrow">HOMEWORK / STATE IN A REAL INTERFACE</p><h3>Build a tech desk</h3><p className="muted">Add equipment, adjust quantities and keep your total within a budget. Prices are sample KRW values for this exercise.</p>
 <div className="controls"><strong>Starter setups:</strong><button onClick={()=>preset([1,2])}>Gaming station</button><button onClick={()=>preset([1,3,4])}>Mobile studio</button><button onClick={()=>preset([1,5])}>Editing desk</button></div>
 <div className="controls" style={{margin:'16px 0'}}>{['All gear','Audio','Computers','Mobile'].map(g=><button key={g} aria-pressed={group===g} onClick={()=>setGroup(g)}>{g}</button>)}</div>
 <div className="shop-layout"><div className="grid">{visible.map(p=><article className="product" key={p.id}><img src={p.image} alt={p.name} loading="lazy" width="320" height="180" style={{width:'100%',height:150,objectFit:'contain',background:'#fff',borderRadius:8}}/><h4>{p.name}</h4><p>{money.format(p.price)}</p><button onClick={()=>add(p)}>Add to setup</button></article>)}</div>
 <aside className="cart" aria-label="Your setup"><h3>Your setup</h3><label className="field">Budget: <strong>{money.format(budget)}</strong><input aria-label="Set budget" type="range" min="500000" max="12000000" step="100000" value={budget} onChange={e=>setBudget(Number(e.target.value))}/></label>
 <progress max={budget} value={Math.min(total,budget)} aria-label="Budget used" style={{width:'100%'}}/>
 <p className={remaining<0?'status':'muted'} role="status">{remaining<0?money.format(-remaining)+' over budget':money.format(remaining)+' remaining'}</p>
 {items.length===0?<p className="muted">Your setup is empty. Add a product or choose a starter setup.</p>:<ul>{items.map(p=><li key={p.id}><strong>{p.name}</strong><br/><span className="muted">{money.format(p.price*p.quantity)}</span><div className="controls"><button aria-label={'Decrease '+p.name} onClick={()=>change(p.id,-1)}>−</button><span>{p.quantity}</span><button aria-label={'Increase '+p.name} onClick={()=>change(p.id,1)}>+</button><button onClick={()=>setItems(old=>old.filter(x=>x.id!==p.id))}>Remove</button></div></li>)}</ul>}
 <p><strong>{items.reduce((s,p)=>s+p.quantity,0)} items · {money.format(total)}</strong></p><button onClick={()=>setItems([])} disabled={!items.length}>Clear setup</button></aside></div></section>
}
function Counter(){
 const [count,setCount]=useState(0),[history,setHistory]=useState([0]);
 function save(next){if(next===count)return;setCount(next);setHistory(old=>[...old,next].slice(-5))}
 function undo(){if(history.length<2)return;setCount(history[history.length-2]);setHistory(old=>old.slice(0,-1))}
 return <section className="exercise-card"><h3>Counter with history</h3><p className="score" role="status" aria-live="polite">{count}</p><div className="controls"><button onClick={()=>save(count+1)}>+1</button><button onClick={()=>save(count-1)}>−1</button><button onClick={()=>save(0)}>Reset</button><button onClick={undo} disabled={history.length<2}>Undo</button></div><p className="muted">Last five values: {history.join(' → ')}</p><p className="muted">Try changing the number several times, then undo your last change.</p></section>
}
function Scoreboard(){
 const [one,setOne]=useState(0),[two,setTwo]=useState(0);
 return <section className="exercise-card"><h3>Two-player scoreboard</h3><div className="grid">{[['Player 1',one,setOne],['Player 2',two,setTwo]].map(([name,value,set])=><article className="mini-card" key={name}><h4>{name}</h4><p className="score">{value}</p><div className="controls"><button onClick={()=>set(v=>v-1)} aria-label={'Decrease '+name}>−</button><button onClick={()=>set(v=>v+1)} aria-label={'Increase '+name}>+</button></div></article>)}</div><p className="status" role="status">Combined score: {one+two}</p><button onClick={()=>{setOne(0);setTwo(0)}}>Reset both scores</button></section>
}
function WordCount(){
 const [text,setText]=useState('React state makes an interface interactive.');
 const words=text.trim()?text.trim().split(/\s+/).length:0;
 return <section className="exercise-card"><h3>Live word and character count</h3><label className="field" htmlFor="practice-text">Write a short note</label><textarea id="practice-text" rows="5" value={text} onChange={e=>setText(e.target.value)} /><p className="status" role="status" aria-live="polite">{words} words · {text.length} characters</p><button onClick={()=>setText('')} disabled={!text}>Clear text</button></section>
}
function Tips(){
 const tips=['Call useState at the top level of a function component.','A setter schedules a re-render; it does not change the current render’s variable.','Use the previous-state callback when the next value depends on the previous value.','Never mutate an array or object stored in state. Create a new copy instead.','Keep shared state in the closest common parent component.'];
 const [open,setOpen]=useState(false),[index,setIndex]=useState(0);
 return <section className="exercise-card"><h3>React quick tips</h3><p className="muted">Explore short reminders about state and component updates.</p><button aria-expanded={open} aria-controls="tip-content" onClick={()=>setOpen(v=>!v)}>{open?'Hide tip':'Show tip'}</button><div id="tip-content" hidden={!open}><p className="status" role="status">{tips[index]}</p><button onClick={()=>setIndex(v=>(v+1)%tips.length)}>Next tip</button><span className="muted"> Tip {index+1} of {tips.length}</span></div></section>
}
function StudyQueue(){
 const [input,setInput]=useState(''),[items,setItems]=useState([]);
 function add(e){e.preventDefault();const title=input.trim();if(!title)return;setItems(old=>[...old,{id:Date.now()+Math.random(),title,done:false}]);setInput('')}
 const done=items.filter(x=>x.done).length;
 return <section className="exercise-card"><h3>Study queue</h3><form onSubmit={add}><label className="field" htmlFor="new-task">New study task</label><div className="controls"><input id="new-task" type="text" value={input} onChange={e=>setInput(e.target.value)} placeholder="e.g. Review useState" required/><button type="submit">Add task</button></div></form><p className="status" role="status">{done} of {items.length} tasks completed</p>{items.length===0?<p className="muted">Your study queue is empty.</p>:items.map(item=><div className="task-row" key={item.id}><input type="checkbox" checked={item.done} onChange={()=>setItems(old=>old.map(x=>x.id===item.id?{...x,done:!x.done}:x))} aria-label={'Mark '+item.title+' complete'}/><span className={item.done?'done':''}>{item.title}</span><button onClick={()=>setItems(old=>old.filter(x=>x.id!==item.id))}>Remove</button></div>)}<button onClick={()=>setItems(old=>old.filter(x=>!x.done))} disabled={!done}>Clear completed</button></section>
}
function App(){
 const [active,setActive]=useState('builder'),[preview,setPreview]=useState('builder'),[practiced,setPracticed]=useState([]);
 const current=sections.find(x=>x[0]===active),Component={builder:Builder,counter:Counter,score:Scoreboard,words:WordCount,tips:Tips,queue:StudyQueue}[active];
 function openExercise(){setActive(preview);document.getElementById('workspace')?.scrollIntoView({behavior:'smooth',block:'start'});}
 const briefs={builder:'Choose equipment, adjust quantities and keep your setup within a budget.',counter:'Change a value and undo recent counter updates.',score:'Update two players’ scores independently.',words:'Type notes and see live word and character counts.',tips:'Reveal short reminders about React state.',queue:'Add study tasks, complete them and track progress.'};
 return <main className="shell" id="main">
 <header className="topbar"><a className="brand" href="../index.html">ABINASH / WEB PROGRAMMING</a><nav className="toplinks" aria-label="Course navigation"><a href="../index.html">Course home</a><a href="../week11-friday/tasks.html">Previous week</a></nav></header>
 <section className="hero"><div><p className="eyebrow">WEEK 12 / MONDAY / REACT</p><h1>Make state<br/><span>visible.</span></h1><p>Explore how React remembers values between renders. Work through a small shop builder, then practise with counters, scores, text and task lists.</p><div className="chips"><span className="chip">Abinash Lamichhane</span><span className="chip">202637724</span><span className="chip">Computer Engineering</span></div></div><aside className="hero-card"><p className="eyebrow">THE BIG IDEA</p><h2>State is the data a component remembers.</h2><p className="muted">Update state with its setter and React renders the screen again with the new value.</p><pre>const [count, setCount] = useState(0);</pre><p className="muted">The setter requests an update. Do not assign a new value directly to the state variable.</p></aside></section>
 <section className="launchpad" aria-label="Choose an exercise"><div><p className="eyebrow">PICK UP WHERE YOU WANT</p><h2>{sections.find(x=>x[0]===preview)[1]}</h2><p>{briefs[preview]}</p><button onClick={openExercise}>Go to exercise ↓</button></div><div className="launch-choices" role="group" aria-label="Preview an exercise">{sections.map(([id,label])=><button key={id} aria-pressed={preview===id} onClick={()=>setPreview(id)}>{label}</button>)}</div></section>
 <div className="progress-wrap"><span>Exercises marked as practised</span><strong>{practiced.length} / {sections.length}</strong></div><progress max={sections.length} value={practiced.length} aria-label="Practice progress"/>
 <div className="layout" id="workspace" tabIndex="-1"><aside className="menu"><h2>Choose a practice</h2><div className="menu-list">{sections.map(([id,label],i)=><button key={id} onClick={()=>setActive(id)} aria-pressed={active===id}>{String(i+1).padStart(2,'0')} / {label}{practiced.includes(id)?' ✓':''}</button>)}</div></aside><section className="content" aria-label="Selected exercise"><div className="content-head"><div><p className="eyebrow">{active==='builder'?'MAIN HOMEWORK':'PRACTICE'}</p><h2>{current[1]}</h2></div><button onClick={()=>setPracticed(old=>old.includes(active)?old.filter(x=>x!==active):[...old,active])} aria-pressed={practiced.includes(active)}>{practiced.includes(active)?'Practised ✓':'Mark as practised'}</button></div><Component/><div className="controls" style={{justifyContent:'space-between',marginTop:16}}><button onClick={()=>setActive(sections[Math.max(0,sections.findIndex(x=>x[0]===active)-1)][0])} disabled={active===sections[0][0]}>← Previous</button><span className="muted">{sections.findIndex(x=>x[0]===active)+1} of {sections.length}</span><button onClick={()=>setActive(sections[Math.min(sections.length-1,sections.findIndex(x=>x[0]===active)+1)][0])} disabled={active===sections[sections.length-1][0]}>Next →</button></div></section></div>
 <footer className="footer">Week 12 Monday · React State and useState · Abinash Lamichhane · Gachon University</footer></main>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

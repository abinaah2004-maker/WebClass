<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 12 Friday · Sprint Quiz</title><style>body{margin:0;background:#101820;color:#eef5f3;font:16px/1.6 system-ui}.wrap{max-width:850px;margin:auto;padding:24px}a{color:#80d5c5}h1{font-size:2.5rem}.q{background:#1b2a35;border:1px solid #3a515e;border-radius:12px;padding:17px;margin:14px 0}label{display:block;padding:5px}button{background:#29434e;color:white;border:1px solid #55717c;border-radius:8px;padding:10px 15px;font:inherit;cursor:pointer}.result{background:#203b3d;padding:14px;border-left:4px solid #80d5c5;margin-top:16px}</style></head><body><main class="wrap"><a href="index.html">← Week 12 Friday lab</a><h1>React Effects · Sprint Quiz</h1><p>Eight questions based on the Friday lecture. Choose one answer for each question, then check your result.</p><form id="quiz"></form><button id="check" type="button">Check answers</button><div id="result" aria-live="polite"></div></main><script>
const questions=[
["When does useEffect run?",["During rendering","After React commits the render to the DOM","Only when the tab regains focus"],1,"Effects run after the render is committed; they do not run during rendering."],
["Which call runs after every render?",["useEffect(fn, [])","useEffect(fn, [count])","useEffect(fn)"],2,"Omitting the dependency array means the effect runs after every render."],
["Why should the useEffect callback not be async?",["It returns a Promise","fetch cannot be used inside it","await blocks the browser"],0,"React expects the effect callback to return undefined or a cleanup function, not a Promise."],
["What stops an interval when a component unmounts?",["React clears it automatically","Return cleanup that calls clearInterval","Set the interval delay to zero"],1,"Timers live in the browser; returned cleanup must clear them."],
["How can a stale fetch response be prevented from replacing a newer result?",["Add more state variables","Remove all dependencies","Abort or ignore the previous request in cleanup"],2,"Cleanup runs before the next effect; abort or ignore the old request."],
["When does a lazy useState initializer run?",["Only on the initial render","On every render","Whenever the state changes"],0,"The function form computes the initial state once."],
["Which pattern can cause an infinite render loop?",["setCount(c => c + 1) with []","setCount(count + 1) with [count]","document.title = count with [count]"],1,"The effect changes its own dependency, causing another run."],
["What is the best way to compute fullName from first and last?",["Store it in separate state","Update it in an effect","Compute const fullName = first + ' ' + last during render"],2,"Derived values should be calculated during rendering when possible."]
];
const form=document.getElementById("quiz");
questions.forEach((q,i)=>{const box=document.createElement("section");box.className="q";const title=document.createElement("strong");title.textContent=(i+1)+". "+q[0];box.append(title);q[1].forEach((a,j)=>{const label=document.createElement("label"),input=document.createElement("input");input.type="radio";input.name="q"+i;input.value=j;label.append(input,document.createTextNode(" "+a));box.append(label)});form.append(box)});
document.getElementById("check").addEventListener("click",()=>{let score=0,answered=0;const details=[];questions.forEach((q,i)=>{const selected=form.querySelector('input[name="q'+i+'"]:checked');if(selected){answered++;if(Number(selected.value)===q[2])score++;details.push((i+1)+". "+(Number(selected.value)===q[2]?"Correct — ":"Review — ")+q[3])}else details.push((i+1)+". Not answered — "+q[3])});document.getElementById("result").innerHTML="";const box=document.createElement("div");box.className="result";const heading=document.createElement("h2");heading.textContent="Score: "+score+" / 8 ("+answered+" answered)";box.append(heading);details.forEach(t=>{const p=document.createElement("p");p.textContent=t;box.append(p)});document.getElementById("result").append(box)});
</script></body></html>

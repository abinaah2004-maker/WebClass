<body><header class="wrap top"><a href="../../index.html">← Coursework home</a><span>WEEK 12 · FRIDAY · REACT</span><a href="../index.html">Monday useState →</a></header><div id="root"><main class="wrap">Loading React…</main></div>
<script type="text/babel">
const {useState,useEffect}=React;
function App(){
const [count,setCount]=useState(0),[log,setLog]=useState([]),[seconds,setSeconds]=useState(0),[running,setRunning]=useState(false);
const [name,setName]=useState("octocat"),[user,setUser]=useState(null),[loading,setLoading]=useState(false),[error,setError]=useState("");
const [theme,setTheme]=useState(()=>{try{return localStorage.getItem("w12-theme")||"light"}catch{return "light"}});
const [unread,setUnread]=useState(3),[first,setFirst]=useState("Abinash"),[last,setLast]=useState("Lamichhane");
const [city,setCity]=useState("Seoul"),[weather,setWeather]=useState(null),[weatherBusy,setWeatherBusy]=useState(false),[weatherError,setWeatherError]=useState("");
const [answers,setAnswers]=useState({}),[marked,setMarked]=useState(false);
useEffect(()=>{setLog(old=>[...old.slice(-4),"Effect ran with count = "+count])},[count]);
useEffect(()=>{if(!running)return;const timer=setInterval(()=>setSeconds(s=>s+1),1000);return()=>clearInterval(timer)},[running]);
useEffect(()=>{try{localStorage.setItem("w12-theme",theme)}catch{}},[theme]);
useEffect(()=>{document.title="Inbox ("+unread+") | W12 Effects"},[unread]);
async function searchUser(e){e.preventDefault();if(!name.trim())return;setLoading(true);setError("");setUser(null);try{const r=await fetch("https://api.github.com/users/"+encodeURIComponent(name.trim()));if(!r.ok)throw Error(r.status===404?"User not found (404)":"Request failed: "+r.status);setUser(await r.json())}catch(e){setError(e.message||"Network error")}finally{setLoading(false)}}
async function getWeather(e){e.preventDefault();setWeatherBusy(true);setWeatherError("");setWeather(null);try{const g=await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(city)+"&count=1&language=en&format=json");if(!g.ok)throw Error("Geocoding request failed");const gd=await g.json();if(!gd.results?.length)throw Error("City not found. Check the spelling.");const place=gd.results[0];const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude="+place.latitude+"&longitude="+place.longitude+"&current=temperature_2m,wind_speed_10m,weather_code");if(!r.ok)throw Error("Weather request failed");const d=await r.json();setWeather({place:place.name,country:place.country,...d.current})}catch(e){setWeatherError(e.message||"Network error")}finally{setWeatherBusy(false)}}
const qs=[
["When does useEffect run?","After React commits the render (typically after paint)"],
["Which pattern runs after every render?","useEffect(fn) with no dependency array"],
["Why should the effect callback not be async?","It returns a Promise, not undefined or a cleanup function"],
["How do you stop a timer on unmount?","Return cleanup that calls clearInterval"],
["How do you prevent stale fetch results?","Abort or ignore the previous request in cleanup"],
["When does a lazy useState initializer run?","Only on the initial render"],
["Which effect can cause an infinite loop?","setCount(count + 1) with [count]"],
["How should fullName be computed?","Derive it during rendering from first and last"]
];
const nav=[["overview","Overview"],["deps","Dependencies"],["fetch","Fetching"],["cleanup","Cleanup"],["abort","AbortController"],["lookup","GitHub lookup"],["storage","localStorage"],["title","Document title"],["gotchas","Gotchas"],["weather","Weather homework"],["quiz","Sprint quiz"]];
return <main className="wrap"><div className="hero"><p className="eyebrow">WEB PROGRAMMING · K0126_002</p><h1>React Effects<br/>in action.</h1><p className="muted">Week 12 Friday · Learn when effects run, fetch data, clean up timers and requests, and synchronize with browser APIs. Work through the labs and check your understanding.</p><span className="tile">Abinash Lamichhane · 202637724</span></div>
<div className="layout"><nav className="nav" aria-label="Exercise navigation">{nav.map(([id,t])=><a href={"#"+id} key={id}>{t}</a>)}</nav><div>
<section id="overview"><p className="eyebrow">01 · CORE IDEA</p><h2>What is a side effect?</h2><p className="muted">Rendering is a pure calculation: props + state produce JSX. Effects run after React commits the render and synchronize with something outside React, such as an API, timer, document title, event listener, or localStorage.</p><div className="grid"><div className="tile"><b>Mount</b>Render → Paint → Effect runs</div><div className="tile"><b>Update</b>Render → Paint → old cleanup → new effect</div><div className="tile"><b>Unmount</b>Cleanup runs</div><div className="tile"><b>Remember</b>Effects do not run during rendering</div></div><pre className="code">{'useEffect(() => {\n  // synchronize with an external system\n  return () => { /* cleanup */ };\n}, [dependencies]);'}</pre></section>
<section id="deps"><p className="eyebrow">02 · DEPENDENCY ARRAY</p><h2>Three dependency patterns</h2><p>Increase the count and inspect the effect log. This example uses <code>[count]</code>.</p><div className="demo row"><button onClick={()=>setCount(c=>c+1)}>Increase count</button><b>Count: {count}</b></div><ul>{log.map((x,i)=><li key={i}>{x}</li>)}</ul><div className="grid"><div className="tile"><b>[]</b>Once after first render</div><div className="tile"><b>[value]</b>After mount and when value changes</div><div className="tile"><b>No array</b>After every render</div><div className="tile"><b>Dependency rule</b>Include every component-scope variable read inside the effect</div></div></section>
<section id="fetch"><p className="eyebrow">03 · DATA FETCHING</p><h2>Fetching data and async/await</h2><p>Use loading, data, and error states. Check <code>response.ok</code>. Do not make the effect callback async; define an async function inside it and call it.</p><pre className="code">{'useEffect(() => {\n  async function load() {\n    try {\n      const response = await fetch(url);\n      if (!response.ok) throw new Error("Request failed");\n      setData(await response.json());\n    } catch (error) { setError(error.message); }\n  }\n  load();\n}, [url]);'}</pre></section>
<section id="cleanup"><p className="eyebrow">04 · CLEANUP</p><h2>Timer cleanup</h2><p>A timer continues in the browser until it is cleared. Start and stop this clock.</p><div className="demo row"><button onClick={()=>setRunning(v=>!v)}>{running?"Stop clock":"Start clock"}</button><b>{seconds} seconds</b><span className="muted">{running?"Interval running":"Interval stopped"}</span></div><pre className="code">{'useEffect(() => {\n  const id = setInterval(() => setTime(new Date()), 1000);\n  return () => clearInterval(id);\n}, []);'}</pre></section>
<section id="abort"><p className="eyebrow">05 · REQUEST CLEANUP</p><h2>AbortController and race conditions</h2><p>When a dependency changes, cleanup can abort the previous request. This prevents an older response from replacing newer data.</p><pre className="code">{'useEffect(() => {\n  const controller = new AbortController();\n  async function load() {\n    try {\n      const r = await fetch(url, { signal: controller.signal });\n      setData(await r.json());\n    } catch (e) {\n      if (e.name !== "AbortError") setError(e.message);\n    }\n  }\n  load();\n  return () => controller.abort();\n}, [url]);'}</pre></section>
<section id="lookup"><p className="eyebrow">06 · CODE CHALLENGE</p><h2>GitHub User Lookup</h2><p>Search a username. Display avatar, name, bio, followers, and public repositories.</p><form className="row" onSubmit={searchUser}><input aria-label="GitHub username" value={name} onChange={e=>setName(e.target.value)} placeholder="GitHub username"/><button disabled={loading}>{loading?"Loading…":"Search"}</button></form>{error&&<p className="error" role="alert">{error}</p>}{user&&<div className="demo row"><img className="avatar" src={user.avatar_url} alt={user.login+" avatar"}/><div><h3>{user.name||user.login}</h3><p>{user.bio||"No public bio"}</p><p>{user.followers} followers · {user.public_repos} public repos</p><a href={user.html_url} target="_blank" rel="noreferrer">Open GitHub profile</a></div></div>}</section>
<section id="storage"><p className="eyebrow">07 · PERSISTENCE</p><h2>localStorage theme toggle</h2><p>Read the initial value with a lazy initializer, then write when the value changes. Refresh the page to test persistence.</p><div className="demo row"><b>Saved theme: {theme}</b><button onClick={()=>setTheme(t=>t==="light"?"dark":"light")}>Toggle theme</button></div><pre className="code">{'const [theme, setTheme] = useState(\n  () => localStorage.getItem("theme") || "light"\n);\nuseEffect(() => {\n  localStorage.setItem("theme", theme);\n}, [theme]);'}</pre></section>
<section id="title"><p className="eyebrow">08 · DOCUMENT TITLE</p><h2>Synchronize the browser tab title</h2><div className="demo row"><button onClick={()=>setUnread(n=>Math.max(0,n-1))}>Mark one read</button><button onClick={()=>setUnread(3)}>Reset</button><b>Inbox ({unread})</b></div><pre className="code">{'useEffect(() => {\n  document.title = "Inbox (" + count + ")";\n}, [count]);'}</pre></section>
<section id="gotchas"><p className="eyebrow">09 · COMMON GOTCHAS</p><h2>Infinite loops and derived state</h2><p>An effect that changes a state value listed in its own dependency array can re-run forever. Avoid trying the unguarded loop.</p><pre className="code">{'// Dangerous: the effect changes its own dependency\nuseEffect(() => { setCount(count + 1); }, [count]);\n\n// Better: derive values during rendering\nconst fullName = first + " " + last;'}</pre><h3>Try derived state</h3><div className="row"><input aria-label="First name" value={first} onChange={e=>setFirst(e.target.value)}/><input aria-label="Last name" value={last} onChange={e=>setLast(e.target.value)}/></div><p className="status">Derived full name: <b>{first+" "+last}</b></p><p className="muted">No extra state or effect is needed. StrictMode may intentionally run effects an extra time in development.</p></section>
<section id="weather"><p className="eyebrow">10 · HOMEWORK</p><h2>Weather Dashboard · Open-Meteo</h2><p>Free API; no key required. Enter a city to geocode it, then load current temperature, wind speed, and weather code.</p><form className="row" onSubmit={getWeather}><input aria-label="City name" value={city} onChange={e=>setCity(e.target.value)} placeholder="City name"/><button disabled={weatherBusy}>{weatherBusy?"Loading…":"Get weather"}</button></form>{weatherError&&<p className="error" role="alert">{weatherError}</p>}{weather&&<div className="demo"><h3>{weather.place}, {weather.country}</h3><p><b>{weather.temperature_2m} °C</b> · Wind {weather.wind_speed_10m} km/h</p><p className="muted">Weather code: {weather.weather_code}</p></div>}<p className="muted">Homework requirements: loading and error states; handle network failures, invalid cities/coordinates, and API errors. Bonus: request location with navigator.geolocation. Submit GitHub repository URL, live GitHub Pages URL, and SprintQuiz.html.</p><a href="SprintQuiz.html">Open SprintQuiz.html →</a></section>
<section id="quiz"><p className="eyebrow">11 · CHECK YOUR UNDERSTANDING</p><h2>Friday sprint quiz</h2><p>Choose one answer for each question, then check your score.</p>{qs.map((q,i)=><div className="demo" key={i}><b>{i+1}. {q[0]}</b>{[q[1],"During rendering, before JSX is returned","It happens only when the browser tab is focused","React automatically handles every cleanup"].filter((v,j,a)=>a.indexOf(v)===j).map((a,j)=><label key={j}><input type="radio" name={"q"+i} checked={answers[i]===a} onChange={()=>{setAnswers(v=>({...v,[i]:a}));setMarked(false)}}/> {a}</label>)}</div>)}<button onClick={()=>setMarked(true)}>Check answers</button>{marked&&<p className="status">Score: {qs.filter((q,i)=>answers[i]===q[1]).length} / 8</p>}</section>
</div></div><footer className="foot">Week 12 Friday · React Effects & useEffect · Abinash Lamichhane · Gachon University</footer></main>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>

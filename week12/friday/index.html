<body>

<script type="text/babel">
const {useState,useEffect}=React;
const labs=[['title','Tab-title reminders','E1 / BROWSER API'],['github','GitHub profile dashboard','E2 / FETCH + CLEANUP'],['stopwatch','Stopwatch and laps','E3 / INTERVALS'],['weather','Weather dashboard','E4 / ASYNC DATA'],['name','Name badge preview','E5 / DERIVED VALUES']];
function App(){
 const [active,setActive]=useState(0),[done,setDone]=useState([]),[theme,setTheme]=useState(()=>{try{return localStorage.getItem('effects-studio-theme')||'light'}catch{return 'light'}});
 useEffect(()=>{document.documentElement.dataset.theme=theme;try{localStorage.setItem('effects-studio-theme',theme)}catch{}},[theme]);
 function complete(){setDone(old=>old.includes(active)?old:[...old,active])}
 const current=labs[active];
 return <main className="wrap" id="main">
 <header className="top"><a className="brand" href="../../index.html">WEB PROGRAMMING <span>/ WEEK 12</span></a><nav className="links" aria-label="Course navigation"><a href="../index.html">Monday · State</a><a href="../../index.html">Course home</a><button type="button" onClick={()=>setTheme(v=>v==='dark'?'light':'dark')}>{theme==='dark'?'Light theme':'Dark theme'}</button></nav></header>
 <section className="hero"><div><p className="eyebrow">FRIDAY PRACTICAL / REACT 18</p><h1>Make effects<br/><span>do the work.</span></h1><p className="lead">Five hands-on exercises, four focused effect demonstrations, and a short recap. Work through each task and inspect the React pattern behind it.</p></div><aside className="hero-card"><p className="eyebrow">THE KEY IDEA</p><h2>Effects synchronize React with the outside world.</h2><p>Use them for browser APIs, network requests, timers and subscriptions. Clean up anything your effect starts.</p><code>useEffect(() =&gt; { /* synchronize */ }, [dependencies]);</code></aside></section>
 <div className="progress-card"><div className="progress-top"><span>Main exercises practiced</span><strong>{done.length} / {labs.length}</strong></div><div className="track"><div className="fill" style={{width:done.length/labs.length*100+'%'}}/></div></div>
 <div className="layout"><aside className="rail"><h2>Exercise navigator</h2><nav aria-label="Main exercises">{labs.map(([id,label,tag],i)=><button key={id} aria-pressed={active===i} onClick={()=>setActive(i)}><small>{tag}</small>{String(i+1).padStart(2,'0')} · {label}{done.includes(i)&&<span className="tick"> ✓</span>}</button>)}</nav><p className="muted" style={{fontSize:12}}>Try the interaction before marking it as practiced.</p></aside>
 <section className="stage"><div className="stage-head"><div><p className="eyebrow">{current[2]}</p><h2>{current[1]}</h2></div><button onClick={complete} disabled={done.includes(active)}>{done.includes(active)?'Practiced ✓':'Mark as practiced'}</button></div><div className="panel">{active===0?<TabTitle/>:active===1?<GitHubSearch/>:active===2?<Stopwatch/>:active===3?<Weather/>:<NameBadge/>}</div></section></div>
 <section className="progress-card"><p className="eyebrow">FOUR QUICK DEMONSTRATIONS</p><h2 style={{margin:'2px 0 14px'}}>Effect demos</h2><EffectDemos/></section>
 <section className="progress-card"><p className="eyebrow">END-OF-LAB REFLECTION</p><h2 style={{margin:'2px 0 12px'}}>What I learned</h2><ul className="recap"><li><strong>Dependencies:</strong> effects re-run when values in their dependency list change.</li><li><strong>Cleanup:</strong> clear timers and abort requests when an effect is replaced or the component unmounts.</li><li><strong>Derived values:</strong> calculate values during rendering when they can be built from existing state.</li><li><strong>External systems:</strong> effects are useful for synchronizing with browser APIs, storage and remote data.</li></ul></section>
 <footer className="bottom">Week 12 Friday · React Effects and useEffect · Web Programming K0126_002</footer></main>
}
function TabTitle(){
 const [count,setCount]=useState(0);
 useEffect(()=>{const previous=document.title;document.title=count?'('+count+') Lab reminders':'Week 12 Friday | Effects Studio';return()=>{document.title=previous}},[count]);
 return <><h3>Lab reminders</h3><p className="muted">Add a reminder and watch the browser tab title update.</p><div className="demo"><p className="stat">{count} unread</p><div className="row"><button onClick={()=>setCount(n=>n+1)}>Add reminder</button><button onClick={()=>setCount(0)}>Clear reminders</button></div></div><pre className="code">{'useEffect(() => {\n  const previous = document.title;\n  document.title = count ? "(" + count + ") Lab reminders" : "Effects Studio";\n  return () => { document.title = previous; };\n}, [count]);'}</pre><p className="hint">The effect synchronizes React state with the browser document title. Cleanup restores the previous title.</p></>
}
function GitHubSearch(){
 const [draft,setDraft]=useState('octocat'),[query,setQuery]=useState('octocat'),[result,setResult]=useState(null),[sort,setSort]=useState('recent');
 useEffect(()=>{if(!query)return;const controller=new AbortController();const signal=controller.signal;async function load(){try{const response=await fetch('https://api.github.com/users/'+encodeURIComponent(query),{signal});if(!response.ok){if(response.status===404)throw Error('GitHub user not found.');if(response.status===403||response.status===429)throw Error('GitHub rate limit reached. Try again later.');throw Error('GitHub request failed: '+response.status)}const user=await response.json();if(signal.aborted)return;setResult({user});const reposResponse=await fetch(user.repos_url+'?sort=updated&direction=desc&per_page=8',{signal});if(!reposResponse.ok)throw Error('Profile loaded, but repositories could not be retrieved.');const repos=await reposResponse.json();if(!signal.aborted)setResult({user,repos})}catch(error){if(!signal.aborted)setResult({error:error.message})}}load();return()=>controller.abort()},[query]);
 const user=result?.user,repos=result?.repos,sorted=repos?[...repos].sort((a,b)=>sort==='stars'?b.stargazers_count-a.stargazers_count:Date.parse(b.updated_at)-Date.parse(a.updated_at)):[];
 return <><h3>GitHub profile dashboard</h3><p className="muted">Look up a public GitHub user and inspect their latest repositories.</p><form className="row" onSubmit={e=>{e.preventDefault();if(draft.trim())setQuery(draft.trim())}}><label style={{flex:1}}>GitHub username<input value={draft} onChange={e=>setDraft(e.target.value)} placeholder="Enter username"/></label><button disabled={!draft.trim()}>Search profile</button></form>{!result&&<p className="status" role="status">Loading @{query}…</p>}{result?.error&&<p className="error" role="alert">{result.error}</p>}{user&&<div className="demo"><div className="profile"><img className="avatar" src={user.avatar_url} alt={user.login+' avatar'}/><div><h4>{user.name||user.login}</h4><a href={user.html_url} target="_blank" rel="noreferrer">@{user.login} ↗</a><p className="muted">{user.bio||'No public bio'}</p></div></div><dl className="stats">{[['Public repos',user.public_repos],['Followers',user.followers],['Following',user.following]].map(([k,v])=><div key={k}><dt>{k}</dt><dd>{v}</dd></div>)}</dl><div className="row"><strong>Repositories</strong><button type="button" aria-pressed={sort==='recent'} onClick={()=>setSort('recent')}>Recently updated</button><button type="button" aria-pressed={sort==='stars'} onClick={()=>setSort('stars')}>Most stars</button></div>{!repos?<p className="muted" role="status">Loading repositories…</p>:<ul className="repos">{sorted.map(repo=><li className="repo" key={repo.id}><a href={repo.html_url} target="_blank" rel="noreferrer">{repo.name} ↗</a><p>{repo.description||'No description provided.'}</p><small>{[repo.language,repo.stargazers_count+' stars',repo.forks_count+' forks'].filter(Boolean).join(' · ')}</small></li>)}</ul>}</div>}<pre className="code">{'useEffect(() => {\n  const controller = new AbortController();\n  fetch(profileUrl, { signal: controller.signal })\n    .then(response => response.json())\n    .then(setProfile);\n  return () => controller.abort();\n}, [username]);'}</pre><p className="hint">The effect fetches when the submitted username changes. AbortController prevents an older request from overwriting a newer search.</p></>
}
function Stopwatch(){
 const [elapsed,setElapsed]=useState(0),[started,setStarted]=useState(null),[now,setNow]=useState(0),[laps,setLaps]=useState([]);
 const total=elapsed+(started===null?0:now-started);
 useEffect(()=>{if(started===null)return;const id=setInterval(()=>setNow(performance.now()),40);return()=>clearInterval(id)},[started]);
 const format=ms=>{const n=Math.floor(ms/1000);return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')+'.'+Math.floor(ms%1000/100)};
 const splits=laps.map((v,i)=>v-(laps[i-1]||0)),fastest=splits.length?Math.min(...splits):null;
 return <><h3>Stopwatch and laps</h3><p className="muted">Start the timer, record lap splits, pause, and reset. The interval is cleaned up when stopped.</p><div className="demo"><div className="stopwatch-dial" style={{'--sweep':(total%60000)/60000*360+'deg'}}><p className="stat" role="timer">{format(total)}</p></div><div className="row"><button disabled={started!==null} onClick={()=>{const t=performance.now();setNow(t);setStarted(t)}}>Start</button><button disabled={started===null} onClick={()=>{setElapsed(elapsed+performance.now()-started);setStarted(null)}}>Stop</button><button disabled={started===null} onClick={()=>setLaps(old=>[...old,elapsed+performance.now()-started])}>Lap</button><button onClick={()=>{setStarted(null);setElapsed(0);setLaps([])}}>Reset</button></div><p className="muted">{started===null?'Timer paused':'Timer running'}</p></div>{fastest!==null&&<p className="status">Fastest lap split: <strong>{format(fastest)}</strong></p>}<h4>Lap history</h4>{laps.length?<ol>{laps.map((lap,i)=><li key={i}>Lap {i+1} · Total {format(lap)} · Split {format(splits[i])}</li>)}</ol>:<p className="muted">No laps recorded yet.</p>}<pre className="code">{'useEffect(() => {\n  if (!running) return;\n  const id = setInterval(tick, 40);\n  return () => clearInterval(id);\n}, [running]);'}</pre><p className="hint">The cleanup clears the interval whenever the running state changes or the component unmounts.</p></>
}
function weatherLabel(code){if(code===0)return'Clear sky';if(code<=2)return'Partly cloudy';if(code===3)return'Overcast';if(code<=48)return'Fog';if(code<=57)return'Drizzle';if(code<=67)return'Rain';if(code<=77)return'Snow';if(code<=82)return'Rain showers';if(code<=86)return'Snow showers';return'Thunderstorm'}
function Weather(){
 const [city,setCity]=useState('Seoul'),[search,setSearch]=useState('Seoul'),[places,setPlaces]=useState(null),[place,setPlace]=useState(null),[weather,setWeather]=useState(null);
 useEffect(()=>{if(!search)return;const controller=new AbortController();async function find(){try{const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(search)+'&count=5&language=en&format=json',{signal:controller.signal});if(!r.ok)throw Error('Could not search for that city.');const data=await r.json();if(!controller.signal.aborted)setPlaces({items:data.results||[]})}catch(e){if(!controller.signal.aborted)setPlaces({error:e.message})}}setPlaces(null);find();return()=>controller.abort()},[search]);
 useEffect(()=>{if(!place)return;const controller=new AbortController();async function forecast(){try{const params=new URLSearchParams({latitude:place.latitude,longitude:place.longitude,current:'temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code',daily:'temperature_2m_max,temperature_2m_min,weather_code',forecast_days:'4',timezone:'auto'});const r=await fetch('https://api.open-meteo.com/v1/forecast?'+params,{signal:controller.signal});if(!r.ok)throw Error('Weather service could not complete the request.');const data=await r.json();if(!controller.signal.aborted)setWeather({data})}catch(e){if(!controller.signal.aborted)setWeather({error:e.message})}}setWeather(null);forecast();return()=>controller.abort()},[place]);
 const placeName=p=>[p.name,p.admin1,p.country].filter(Boolean).join(', ');
 const data=weather?.data;
 const low=data?.daily?Math.min(...data.daily.temperature_2m_min):0;
 const high=data?.daily?Math.max(...data.daily.temperature_2m_max):0;
 const range=Math.max(1,high-low);
 return <><h3>Weather dashboard</h3><p className="muted">Find a city, select the correct location, and fetch current conditions plus a four-day forecast.</p><form className="row" onSubmit={e=>{e.preventDefault();if(city.trim())setSearch(city.trim())}}><label style={{flex:1}}>City name<input value={city} onChange={e=>setCity(e.target.value)} placeholder="Enter a city"/></label><button disabled={!city.trim()}>Find city</button></form>{!places&&<p className="status" role="status">Searching locations…</p>}{places?.error&&<p className="error">{places.error}</p>}{places?.items?.length===0&&<p className="muted">No matching cities. Try another search.</p>}{places?.items?.length>0&&<div className="demo"><strong>Choose a location</strong><div className="row" style={{marginTop:8}}>{places.items.map(p=><button type="button" key={p.id} aria-pressed={place?.id===p.id} onClick={()=>setPlace(p)}>{placeName(p)}</button>)}</div></div>}{place&&!weather&&<p className="status" role="status">Loading weather for {place.name}…</p>}{weather?.error&&<p className="error" role="alert">{weather.error}</p>}{data&&<div className="demo"><h4>{placeName(place)}</h4><p className="stat">{data.current.temperature_2m} °C</p><p>{weatherLabel(data.current.weather_code)}</p><div className="weather-grid">{[['Feels like',data.current.apparent_temperature+' °C'],['Humidity',data.current.relative_humidity_2m+'%'],['Wind',data.current.wind_speed_10m+' km/h'],['Local time',data.current.time.replace('T',' ')]].map(([k,v])=><div className="weather-cell" key={k}><b>{k}</b><strong>{v}</strong></div>)}</div><h4>Four-day forecast</h4><ul className="forecast">{data.daily.time.map((day,i)=><li key={day}><strong>{new Intl.DateTimeFormat('en',{weekday:'short',timeZone:'UTC'}).format(new Date(day))}</strong><span>{weatherLabel(data.daily.weather_code[i])}</span><div className="temperature-track" aria-hidden="true"><span style={{left:(data.daily.temperature_2m_min[i]-low)/range*100+'%',width:(data.daily.temperature_2m_max[i]-data.daily.temperature_2m_min[i])/range*100+'%'}}/></div><strong>{data.daily.temperature_2m_max[i]}° / {data.daily.temperature_2m_min[i]}°</strong></li>)}</ul><small className="muted">Weather data: <a href="https://open-meteo.com/" target="_blank" rel="noreferrer">Open-Meteo</a></small></div>}<pre className="code">{'useEffect(() => {\n  const controller = new AbortController();\n  fetch(weatherUrl, { signal: controller.signal })\n    .then(response => response.json())\n    .then(setForecast);\n  return () => controller.abort();\n}, [selectedCity]);'}</pre><p className="hint">Geocoding and forecast requests are separate effects. Each request is cancelled when its search/location changes.</p></>
}
function NameBadge(){
 const [first,setFirst]=useState('Abinash'),[last,setLast]=useState('Lamichhane');
 const full=[first.trim(),last.trim()].filter(Boolean).join(' '),initials=[first.trim()[0],last.trim()[0]].filter(Boolean).join('').toUpperCase()||'??';
 return <><h3>Name badge preview</h3><p className="muted">Change the two fields. The full name and initials are derived during rendering—no extra effect is needed.</p><div className="row"><label style={{flex:1}}>First name<input value={first} onChange={e=>setFirst(e.target.value)}/></label><label style={{flex:1}}>Last name<input value={last} onChange={e=>setLast(e.target.value)}/></label></div><div className="badge-preview"><span className="initials">{initials}</span><span><strong>{full||'Your name'}</strong><small>React Effects Studio</small></span></div><pre className="code">{'const fullName = [first.trim(), last.trim()]\n  .filter(Boolean).join(" ");\n\nreturn <Badge name={fullName} />;'}</pre><p className="hint">When a value can be calculated from existing state, derive it during rendering instead of storing a duplicate state value.</p></>
}
function EffectDemos(){
 const [mounted,setMounted]=useState(false),[count,setCount]=useState(0),[observed,setObserved]=useState(0),[now,setNow]=useState(new Date()),[accent,setAccent]=useState(()=>{try{return localStorage.getItem('effects-demo-accent')||'mint'}catch{return'mint'}});
 useEffect(()=>{setMounted(true)},[]);
 useEffect(()=>{setObserved(count)},[count]);
 useEffect(()=>{const id=setInterval(()=>setNow(new Date()),1000);return()=>clearInterval(id)},[]);
 useEffect(()=>{try{localStorage.setItem('effects-demo-accent',accent)}catch{}},[accent]);
 return <div className="effect-grid"><article className="effect-card"><p className="eyebrow">01 / MOUNT</p><h3>Runs on mount</h3><p className="muted">An empty dependency array runs after the component mounts.</p><p className="big">{mounted?'Mounted ✓':'Mounting…'}</p><code>useEffect(() =&gt; {}, []);</code></article><article className="effect-card"><p className="eyebrow">02 / DEPENDENCY</p><h3>When a value changes</h3><p className="muted">The effect observes the counter after each update.</p><p className="big">{observed}</p><button onClick={()=>setCount(n=>n+1)}>Increase counter ({count})</button><p><code>useEffect(fn, [count]);</code></p></article><article className="effect-card"><p className="eyebrow">03 / INTERVAL</p><h3>Live clock</h3><p className="big"><time dateTime={now.toISOString()}>{now.toLocaleTimeString()}</time></p><p className="muted">A one-second interval is cleared on unmount.</p><code>return () =&gt; clearInterval(id);</code></article><article className="effect-card"><p className="eyebrow">04 / STORAGE</p><h3>Remember an accent</h3><p className="muted">Change the badge and refresh this page; localStorage keeps the choice.</p><p><span className="accent-chip" style={{background:accent==='mint'?'#236b59':'#b85b35'}}>{accent} accent</span></p><button onClick={()=>setAccent(v=>v==='mint'?'copper':'mint')}>Switch accent</button><p><code>localStorage.setItem(key, value);</code></p></article></div>
}

function App(){
 const [active,setActive]=useState(0),[done,setDone]=useState([]),[theme,setTheme]=useState(()=>{try{return localStorage.getItem('effects-studio-theme')||'light'}catch{return 'light'}});

 function complete(){setDone(old=>old.includes(active)?old:[...old,active])}
 const current=labs[active];
 return <main className="wrap" id="main">
 <header className="top"><a className="brand" href="../../index.html">WEB PROGRAMMING <span>/ WEEK 12</span></a><nav className="links" aria-label="Course navigation"><a href="../index.html">Monday · State</a><a href="../../index.html">Course home</a><button type="button" onClick={()=>setTheme(v=>v==='dark'?'light':'dark')}>{theme==='dark'?'Light theme':'Dark theme'}</button></nav></header>
 <section className="hero"><div><p className="eyebrow">FRIDAY PRACTICAL / REACT 18</p><h1>Make effects<br/><span>do the work.</span></h1><p className="lead">Five hands-on exercises, four focused effect demonstrations, and a short recap. Work through each task and inspect the React pattern behind it.</p></div><aside className="hero-card"><p className="eyebrow">THE KEY IDEA</p><h2>Effects synchronize React with the outside world.</h2><p>Use them for browser APIs, network requests, timers and subscriptions. Clean up anything your effect starts.</p><code>useEffect(() =&gt; { /* synchronize */ }, [dependencies]);</code></aside></section>
 <div className="progress-card"><div className="progress-top"><span>Main exercises practiced</span><strong>{done.length} / {labs.length}</strong></div><div className="track"><div className="fill" style={{width:done.length/labs.length*100+'%'}}/></div></div>

 <section className="progress-card"><p className="eyebrow">END-OF-LAB REFLECTION</p><h2 style={{margin:'2px 0 12px'}}>What I learned</h2><ul className="recap"><li><strong>Dependencies:</strong> effects re-run when values in their dependency list change.</li><li><strong>Cleanup:</strong> clear timers and abort requests when an effect is replaced or the component unmounts.</li><li><strong>Derived values:</strong> calculate values during rendering when they can be built from existing state.</li><li><strong>External systems:</strong> effects are useful for synchronizing with browser APIs, storage and remote data.</li></ul></section>

function TabTitle(){
 const [count,setCount]=useState(0);
 useEffect(()=>{const previous=document.title;document.title=count?'('+count+') Lab reminders':'Week 12 Friday | Effects Studio';return()=>{document.title=previous}},[count]);
 return <><h3>Lab reminders</h3><p className="muted">Add a reminder and watch the browser tab title update.</p><div className="demo"><p className="stat">{count} unread</p><div className="row"><button onClick={()=>setCount(n=>n+1)}>Add reminder</button><button onClick={()=>setCount(0)}>Clear reminders</button></div></div><pre className="code">{'useEffect(() => {\n  const previous = document.title;\n  document.title = count ? "(" + count + ") Lab reminders" : "Effects Studio";\n  return () => { document.title = previous; };\n}, [count]);'}</pre><p className="hint">The effect synchronizes React state with the browser document title. Cleanup restores the previous title.</p></>
}
function GitHubSearch(){
 const [draft,setDraft]=useState('octocat'),[query,setQuery]=useState('octocat'),[result,setResult]=useState(null),[sort,setSort]=useState('recent');
 useEffect(()=>{if(!query)return;const controller=new AbortController();const signal=controller.signal;async function load(){try{const response=await fetch('https://api.github.com/users/'+encodeURIComponent(query),{signal});if(!response.ok){if(response.status===404)throw Error('GitHub user not found.');if(response.status===403||response.status===429)throw Error('GitHub rate limit reached. Try again later.');throw Error('GitHub request failed: '+response.status)}const user=await response.json();if(signal.aborted)return;setResult({user});const reposResponse=await fetch(user.repos_url+'?sort=updated&direction=desc&per_page=8',{signal});if(!reposResponse.ok)throw Error('Profile loaded, but repositories could not be retrieved.');const repos=await reposResponse.json();if(!signal.aborted)setResult({user,repos})}catch(error){if(!signal.aborted)setResult({error:error.message})}}load();return()=>controller.abort()},[query]);

function Stopwatch(){

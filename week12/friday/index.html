<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Week 12 Friday practical React useEffect lab: lifecycle, data fetching, cleanup, browser APIs and weather.">
<title>Week 12 Friday | React Effects Lab</title>
<style>
:root{color-scheme:light;--paper:#f5f2eb;--surface:#fffefa;--ink:#202b3c;--muted:#687386;--line:#d9d7cf;--blue:#3159d9;--blue-soft:#e9edff;--orange:#e58b55;--green:#2f765d;--shadow:0 14px 35px #202b3c0b}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}a{color:var(--blue)}button,input{font:inherit}button{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 13px;border-radius:7px;cursor:pointer;font-weight:650}button:hover{border-color:var(--blue)}button:disabled{opacity:.45;cursor:not-allowed}input{border:1px solid var(--line);background:white;color:var(--ink);border-radius:7px;padding:10px;max-width:100%}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #8ba2ff;outline-offset:2px}
.shell{width:min(1180px,calc(100% - 36px));margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:17px 0;border-bottom:1px solid var(--line)}.brand{font-size:12px;font-weight:900;letter-spacing:.13em;text-decoration:none;color:var(--ink)}.toplinks{display:flex;gap:18px;flex-wrap:wrap}.toplinks a{font-size:13px;font-weight:700;text-decoration:none}
.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:30px;align-items:center;padding:48px 0 30px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);margin:0 0 8px}.hero h1{font-size:clamp(48px,7vw,82px);line-height:.98;letter-spacing:-.06em;margin:0 0 16px}.hero h1 span{color:var(--blue)}.lead{max-width:650px;color:var(--muted);font-size:17px}.hero-note{background:var(--ink);color:#fffefa;padding:23px;border-radius:10px;box-shadow:8px 8px 0 var(--orange)}.hero-note h2{font-size:22px;line-height:1.2;margin:4px 0 10px}.hero-note p{color:#d4d9e3;margin:0}.hero-note code{display:block;margin-top:14px;padding:11px;background:#35435a;border-radius:6px;color:#fff;white-space:pre-wrap}
.progress-box{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:15px 18px;margin:10px 0 22px;box-shadow:var(--shadow)}.progress-top{display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:750}.track{height:8px;background:#e7e6e1;border-radius:9px;overflow:hidden;margin-top:9px}.fill{height:100%;background:var(--blue);transition:width .2s}
.workspace{display:grid;grid-template-columns:245px minmax(0,1fr);gap:22px;align-items:start;padding-bottom:50px}.sidebar{position:sticky;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:14px;box-shadow:var(--shadow)}.sidebar h2{font-size:17px;margin:2px 5px 10px}.navlist{display:grid;gap:5px}.navlist button{text-align:left;border-color:transparent;background:transparent;font-size:13px;padding:10px}.navlist button[aria-pressed=true]{background:var(--blue-soft);border-color:#cbd4ff;color:#2445b8}.navlist small{display:block;color:var(--muted);font-size:10px;letter-spacing:.06em}.mainpanel{min-width:0}.panel-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;padding:7px 2px 13px;border-bottom:2px solid var(--ink);margin-bottom:15px}.panel-head h2{font-size:32px;line-height:1.1;letter-spacing:-.04em;margin:0}.panel-head p{margin:0}.exercise{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:clamp(17px,3vw,27px);box-shadow:var(--shadow)}.exercise h3{font-size:22px;letter-spacing:-.025em;margin:0 0 6px}.muted{color:var(--muted)}.hint{background:#f0f3ff;border-left:3px solid var(--blue);padding:11px 13px;color:#39476b;border-radius:0 6px 6px 0;margin:15px 0}.demo{background:#f7f7f3;border:1px solid var(--line);padding:15px;border-radius:7px;margin:13px 0}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row input{flex:1;min-width:160px}.stat{font-size:36px;font-weight:850;letter-spacing:-.05em;margin:5px 0}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{padding:13px;border:1px solid var(--line);border-radius:7px;background:#fff}.tile b{display:block;color:var(--blue);font-size:13px;margin-bottom:4px}.code{white-space:pre-wrap;overflow-wrap:anywhere;background:#202b3c;color:#eef2ff;border-radius:7px;padding:14px;font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-x:auto}.status{padding:10px 12px;background:#edf6f0;border-left:3px solid var(--green);border-radius:0 6px 6px 0}.error{color:#a12c2c}.avatar{width:68px;height:68px;border-radius:50%;object-fit:cover}.profile{display:flex;gap:14px;align-items:center}.profile h4{margin:0;font-size:18px}.profile p{margin:3px 0}.list{padding-left:20px}.list li{margin:5px 0}.footer{border-top:1px solid var(--line);padding:22px 0 36px;color:var(--muted);font-size:12px}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding-top:35px}.workspace{grid-template-columns:1fr}.sidebar{position:static}.navlist{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles{grid-template-columns:1fr}.panel-head h2{font-size:27px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important}}
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<a href="#main" style="position:absolute;left:-9999px;top:8px;background:white;padding:8px" onfocus="this.style.left='8px'" onblur="this.style.left='-9999px'">Skip to content</a>
<header class="shell topbar"><a class="brand" href="../../index.html">WEB PROGRAMMING / WEEK 12</a><nav class="toplinks" aria-label="Course links"><a href="../index.html">Monday · useState</a><a href="../../index.html">Course home</a></nav></header>
<div id="root"><main class="shell"><p>Loading React practice lab…</p></main></div>
<noscript><p>Enable JavaScript to use the interactive exercises.</p></noscript>
<script type="text/babel">
const {useState,useEffect}=React;
const exercises=[
 ['patterns','Effect patterns','01 / LIFECYCLE'],
 ['title','Tab title','02 / BROWSER API'],
 ['github','GitHub lookup','03 / FETCH + CLEANUP'],
 ['stopwatch','Stopwatch','04 / INTERVAL + CLEANUP'],
 ['clock','Live clock','05 / INTERVAL'],
 ['storage','Saved preference','06 / LOCAL STORAGE'],
 ['derived','Derived values','07 / REACT GOTCHAS']
];
function App(){
 const [active,setActive]=useState('patterns');
 const [done,setDone]=useState([]);
 const [count,setCount]=useState(0),[log,setLog]=useState([]);
 const [unread,setUnread]=useState(4);
 const [username,setUsername]=useState('octocat'),[profile,setProfile]=useState(null),[busy,setBusy]=useState(false),[profileError,setProfileError]=useState('');
 const [seconds,setSeconds]=useState(0),[running,setRunning]=useState(false),[laps,setLaps]=useState([]);
 const [clockOn,setClockOn]=useState(true),[now,setNow]=useState(new Date());
 const [theme,setTheme]=useState(()=>{try{return localStorage.getItem('effects-lab-theme')||'paper'}catch{return 'paper'}});
 const [first,setFirst]=useState('Abinash'),[last,setLast]=useState('Lamichhane');
 const current=exercises.find(x=>x[0]===active);
 useEffect(()=>{setLog(old=>['Effect ran after count became '+count,...old].slice(0,5))},[count]);
 useEffect(()=>{document.title='Inbox ('+unread+') | Effects Lab';return()=>{document.title='Week 12 Friday | React Effects Lab'}},[unread]);
 useEffect(()=>{if(!running)return;const id=setInterval(()=>setSeconds(s=>s+1),1000);return()=>clearInterval(id)},[running]);
 useEffect(()=>{if(!clockOn)return;const id=setInterval(()=>setNow(new Date()),1000);return()=>clearInterval(id)},[clockOn]);
 useEffect(()=>{try{localStorage.setItem('effects-lab-theme',theme)}catch{}},[theme]);
 useEffect(()=>{const saved=localStorage.getItem('effects-lab-theme');if(saved)setTheme(saved)},[]);
 async function searchUser(e){
  e.preventDefault();const query=username.trim();if(!query)return;
  setBusy(true);setProfile(null);setProfileError('');
  try{const response=await fetch('https://api.github.com/users/'+encodeURIComponent(query));if(!response.ok)throw new Error(response.status===404?'That username was not found.':'GitHub returned HTTP '+response.status);setProfile(await response.json())}
  catch(error){setProfileError(error.message||'Network error. Try again.')}finally{setBusy(false)}
 }
 function mark(){setDone(old=>old.includes(active)?old:[...old,active])}
 const formatTime=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
 function renderExercise(){
  if(active==='patterns')return <><h3>When does an effect run?</h3><p className="muted">Change the counter and watch the log. This example uses a dependency array with one value.</p><div className="demo row"><button onClick={()=>setCount(n=>n+1)}>Increase count</button><button onClick={()=>setCount(0)}>Reset</button><strong className="stat"> {count}</strong></div><div className="tiles"><div className="tile"><b>No dependency array</b>Runs after every committed render.</div><div className="tile"><b>Empty array []</b>Runs after the initial mount.</div><div className="tile"><b>[count]</b>Runs after mount and when count changes.</div><div className="tile"><b>Cleanup</b>Runs before the effect re-runs and when the component unmounts.</div></div><h3 style={{marginTop:20}}>Effect log</h3><ol className="list">{log.map((item,i)=><li key={i}>{item}</li>)}</ol><pre className="code">{'useEffect(() => {\n  // synchronize with something outside React\n  return () => { /* cleanup */ };\n}, [count]);'}</pre><p className="hint">Effects run after React commits a render. They are for synchronization with external systems, not for calculating values that can be derived during rendering.</p></>;
  if(active==='title')return <><h3>Synchronize the browser tab title</h3><p className="muted">The number in your browser tab follows the unread-message count.</p><div className="demo row"><button onClick={()=>setUnread(n=>Math.max(0,n-1))}>Mark one read</button><button onClick={()=>setUnread(4)}>Reset inbox</button><strong className="stat">Inbox: {unread}</strong></div><pre className="code">{'useEffect(() => {\n  document.title = "Inbox (" + unread + ")";\n  return () => { document.title = "Effects Lab"; };\n}, [unread]);'}</pre><p className="hint">This is a good useEffect example because the component is synchronizing React state with the browser document title.</p></>;
  if(active==='github')return <><h3>Search a public GitHub profile</h3><p className="muted">Try <code>octocat</code> or enter another GitHub username. This exercise introduces loading, success and error states.</p><form className="row" onSubmit={searchUser}><input aria-label="GitHub username" value={username} onChange={e=>setUsername(e.target.value)} placeholder="GitHub username"/><button disabled={busy}>{busy?'Searching…':'Search profile'}</button></form>{profileError&&<p className="error" role="alert">{profileError}</p>}{profile&&<div className="demo profile"><img className="avatar" src={profile.avatar_url} alt={profile.login+' avatar'}/><div><h4>{profile.name||profile.login}</h4><p className="muted">{profile.bio||'No public bio'}</p><p>{profile.followers} followers · {profile.public_repos} public repositories</p><a href={profile.html_url} target="_blank" rel="noreferrer">View GitHub profile ↗</a></div></div>}<pre className="code">{'useEffect(() => {\n  const controller = new AbortController();\n  fetch(url, { signal: controller.signal })\n    .then(response => { if (!response.ok) throw Error("Request failed"); return response.json(); })\n    .then(setProfile)\n    .catch(error => { if (error.name !== "AbortError") setError(error.message); });\n  return () => controller.abort();\n}, [username]);'}</pre><p className="hint">The search button above runs on submit. The code sample shows the effect pattern with AbortController: cancel the previous request when its dependency changes or the component unmounts.</p></>;
  if(active==='stopwatch')return <><h3>Start, stop and record laps</h3><p className="muted">The interval is created only while the stopwatch is running and cleared when it stops.</p><div className="demo"><p className="stat">{formatTime(seconds)}</p><div className="row"><button onClick={()=>setRunning(v=>!v)}>{running?'Pause':'Start'}</button><button onClick={()=>{setRunning(false);setSeconds(0);setLaps([])}}>Reset</button><button disabled={!running} onClick={()=>setLaps(old=>[seconds,...old])}>Record lap</button><span className="muted">{running?'Timer is running':'Timer is paused'}</span></div></div><h4>Lap history</h4>{laps.length?<ol className="list">{laps.map((lap,i)=><li key={i}>Lap {laps.length-i}: {formatTime(lap)}</li>)}</ol>:<p className="muted">No laps recorded yet.</p>}<pre className="code">{'useEffect(() => {\n  if (!running) return;\n  const id = setInterval(() => setSeconds(s => s + 1), 1000);\n  return () => clearInterval(id);\n}, [running]);'}</pre><p className="hint">Always clean up intervals. Without clearInterval, an old timer can keep running after the component no longer needs it.</p></>;
  if(active==='clock')return <><h3>Live clock with interval cleanup</h3><p className="muted">Toggle the clock to start or stop updating the time every second.</p><div className="demo"><p className="stat">{now.toLocaleTimeString()}</p><div className="row"><button onClick={()=>setClockOn(v=>!v)}>{clockOn?'Pause clock':'Resume clock'}</button><span className="muted">{clockOn?'Updating every second':'Clock paused'}</span></div></div><pre className="code">{'useEffect(() => {\n  if (!clockOn) return;\n  const timer = setInterval(() => setNow(new Date()), 1000);\n  return () => clearInterval(timer);\n}, [clockOn]);'}</pre></>;
  if(active==='storage')return <><h3>Remember a preference after refresh</h3><p className="muted">Choose a workspace accent. The selection is saved in localStorage and restored on the next visit.</p><div className="demo"><p><strong>Saved preference:</strong> {theme}</p><div className="row">{['paper','blue','orange'].map(value=><button key={value} aria-pressed={theme===value} onClick={()=>setTheme(value)}>{value}</button>)}</div><div style={{height:48,borderRadius:7,marginTop:12,background:theme==='blue'?'#3159d9':theme==='orange'?'#e58b55':'#d9d7cf'}}/></div><pre className="code">{'const [theme, setTheme] = useState(\n  () => localStorage.getItem("theme") || "paper"\n);\nuseEffect(() => {\n  localStorage.setItem("theme", theme);\n}, [theme]);'}</pre><p className="hint">The initializer reads the saved value on the first render. The effect writes future changes to localStorage.</p></>;
  return <><h3>Derived values and infinite-loop warning</h3><p className="muted">Change either input. The full name updates immediately without storing a second copy in state.</p><div className="row"><input aria-label="First name" value={first} onChange={e=>setFirst(e.target.value)} placeholder="First name"/><input aria-label="Last name" value={last} onChange={e=>setLast(e.target.value)} placeholder="Last name"/></div><p className="status">Derived full name: <strong>{(first+' '+last).trim()||'—'}</strong></p><pre className="code">{'// Avoid: this effect changes its own dependency\nuseEffect(() => {\n  setCount(count + 1);\n}, [count]); // can loop forever\n\n// Better: calculate during render\nconst fullName = first + " " + last;'}</pre><p className="hint">If a value can be calculated from existing props or state, derive it during rendering instead of copying it into another state variable with an effect.</p><p className="muted">In development, React Strict Mode may run effects an extra time to help reveal missing cleanup logic.</p></>;
 }
 return <main className="shell" id="main">
  <section className="hero"><div><p className="eyebrow">WEB PROGRAMMING · K0126_002 · FRIDAY LAB</p><h1>React effects,<br/><span>made practical.</span></h1><p className="lead">A hands-on lab for synchronizing components with browser APIs, timers and remote data. Choose an exercise, try the interaction, then inspect the pattern behind it.</p></div><aside className="hero-note"><p className="eyebrow" style={{color:'#ffb18b'}}>THE CORE IDEA</p><h2>Effects connect React to the outside world.</h2><p>Render the UI from state. Use an effect when you need to synchronize with something beyond React.</p><code>useEffect(() =&gt; { /* work */ }, [dependencies]);</code></aside></section>
  <div className="progress-box"><div className="progress-top"><span>Exercises completed</span><strong>{done.length} / {exercises.length}</strong></div><div className="track"><div className="fill" style={{width:(done.length/exercises.length*100)+'%'}}/></div></div>
  <div className="workspace"><aside className="sidebar"><h2>Friday workbench</h2><nav className="navlist" aria-label="Exercise navigation">{exercises.map(([id,label,tag],i)=><button key={id} aria-pressed={active===id} onClick={()=>setActive(id)}><small>{tag}{done.includes(id)?' · DONE':''}</small>{String(i+1).padStart(2,'0')} / {label}</button>)}</nav><p className="muted" style={{fontSize:12}}>Mark each exercise after you have tried it.</p></aside>
  <section className="mainpanel" aria-live="polite"><div className="panel-head"><div><p className="eyebrow">{current[2]}</p><h2>{current[1]}</h2></div><button onClick={mark} disabled={done.includes(active)}>{done.includes(active)?'Completed ✓':'Mark complete'}</button></div><div className="exercise">{renderExercise()}</div><div className="row" style={{justifyContent:'space-between',marginTop:14}}><button disabled={exercises[0][0]===active} onClick={()=>setActive(exercises[Math.max(0,exercises.findIndex(x=>x[0]===active)-1)][0])}>← Previous</button><span className="muted">{exercises.findIndex(x=>x[0]===active)+1} of {exercises.length}</span><button disabled={exercises[exercises.length-1][0]===active} onClick={()=>setActive(exercises[Math.min(exercises.length-1,exercises.findIndex(x=>x[0]===active)+1)][0])}>Next →</button></div></section></div>
  <section className="progress-box"><p className="eyebrow">HOMEWORK / OPEN-METEO</p><h2 style={{margin:'3px 0'}}>Build a weather dashboard</h2><p className="muted">Use geocoding and forecast endpoints to fetch live weather. Include loading and error states, handle invalid city names, and cancel outdated requests.</p><a href="weather-dashboard.html">Open the separate Weather Dashboard exercise ↗</a></section>
  <footer className="footer">Week 12 Friday · React Effects and useEffect · Gachon University</footer>
 </main>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>

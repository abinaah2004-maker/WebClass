<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Native Dialog | Abinash</title><style>body{font:16px/1.6 system-ui,sans-serif;max-width:780px;margin:2rem auto;padding:0 1rem;color:#172033}label{display:block;margin:.7rem 0 .2rem}input,button,textarea{font:inherit;padding:.5rem;border:1px solid #94a3b8;border-radius:6px}button{cursor:pointer;background:#1d4ed8;color:white}section,article{padding:1rem;background:#eff6ff;border-radius:10px;margin:1rem 0}a{color:#1d4ed8}</style></head><body><p><a href="../index.html">← Coursework home</a></p><h1>Native HTML dialog</h1><p>The dialog element can show a modal interface using built-in browser behavior.</p><button id="open">Open dialog</button><dialog id="dialog"><h2>Welcome</h2><p>This is a native HTML dialog.</p><form method="dialog"><button>Close</button></form></dialog><script>document.querySelector("#open").onclick=()=>document.querySelector("#dialog").showModal();</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="BookFinder project using the Open Library Search API."><title>BookFinder · Open Library</title><style>
:root{font-family:system-ui,sans-serif;background:#f4f7fb;color:#172033;line-height:1.5}*{box-sizing:border-box}body{margin:0;padding:22px}.wrap{max-width:1050px;margin:auto}.hero,.controls,.results{background:white;border:1px solid #dbe4ef;border-radius:16px;padding:22px;margin:14px 0}h1{margin:0}.controls form{display:flex;gap:8px;flex-wrap:wrap}input,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #c5d3e3}input{flex:1;min-width:200px}button{background:#075985;color:white;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.book{padding:15px;border:1px solid #dbe4ef;border-radius:12px;background:#fbfdff}.book h2{font-size:1.05rem}.muted{color:#53657b}a{color:#0369a1}#status{min-height:1.5em}@media(max-width:600px){body{padding:10px}.hero,.controls,.results{padding:15px}}
</style></head><body><main class="wrap"><header class="hero"><p class="muted">JAVASCRIPT · FETCH · JSON · API</p><h1>BookFinder</h1><p>Search the Open Library catalogue. Built by Abinash Lamichhane for API practice.</p></header><section class="controls"><form id="search-form"><label for="query">Book title, author, or topic</label><input id="query" required value="Harry Potter" placeholder="Search books"><button>Search books</button></form><p id="status" role="status" aria-live="polite">Ready to search.</p></section><section class="results"><div id="books" class="grid"></div></section><p><a href="../index.html">← Back to coursework</a></p></main><script>
const form=document.querySelector('#search-form'),query=document.querySelector('#query'),status=document.querySelector('#status'),books=document.querySelector('#books');form.addEventListener('submit',async e=>{e.preventDefault();const q=query.value.trim();if(!q)return;status.textContent='Loading results…';books.replaceChildren();try{const res=await fetch('https://openlibrary.org/search.json?q='+encodeURIComponent(q)+'&limit=12');if(!res.ok)throw new Error('Request failed ('+res.status+')');const data=await res.json();status.textContent='Found '+data.numFound.toLocaleString()+' matching records. Showing up to 12.';if(!data.docs.length){status.textContent='No books found. Try a different search.';return}data.docs.forEach(b=>{const card=document.createElement('article');card.className='book';const h=document.createElement('h2');h.textContent=b.title||'Untitled';const author=document.createElement('p');author.className='muted';author.textContent=(b.author_name||['Author not listed']).slice(0,3).join(', ');const year=document.createElement('p');year.textContent='First published: '+(b.first_publish_year||'Unknown');card.append(h,author,year);if(b.key){const a=document.createElement('a');a.href='https://openlibrary.org'+b.key;a.target='_blank';a.rel='noopener noreferrer';a.textContent='View on Open Library';card.append(a)}books.append(card)})}catch(err){status.textContent='Could not load books. Check your connection and try again.'}});form.requestSubmit();
</script></body></html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Search Filter</title>


    <style>

        /* ------------------------------
           BASIC RESET
        ------------------------------ */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* ------------------------------
           PAGE
        ------------------------------ */

        body {

            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6,
                    #ec4899
                );

            padding: 30px;

        }


        /* ------------------------------
           MAIN CARD
        ------------------------------ */

        .container {

            width: 430px;

            padding: 35px;

            background: rgba(255, 255, 255, 0.95);

            border-radius: 25px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25);

            animation: appear 0.6s ease;

        }


        /* ------------------------------
           BACK BUTTON
        ------------------------------ */

        .back-link {

            display: inline-flex;

            align-items: center;

            gap: 6px;

            padding: 9px 14px;

            margin-bottom: 25px;

            background: #eef2ff;

            color: #4f46e5;

            border-radius: 10px;

            text-decoration: none;

            font-size: 14px;

            font-weight: bold;

            transition: 0.3s;

        }


        .back-link:hover {

            background: #4f46e5;

            color: white;

            transform: translateX(-3px);

        }


        /* ------------------------------
           TITLE
        ------------------------------ */

        h1 {

            text-align: center;

            color: #1f2937;

            font-size: 28px;

            margin-bottom: 8px;

        }


        .subtitle {

            text-align: center;

            color: #6b7280;

            font-size: 14px;

            margin-bottom: 25px;

        }


        /* ------------------------------
           SEARCH BOX
        ------------------------------ */

        .search-box {

            position: relative;

            margin-bottom: 25px;

        }


        #searchInput {

            width: 100%;

            padding: 15px 18px;

            border: 2px solid #e5e7eb;

            border-radius: 14px;

            font-size: 16px;

            outline: none;

            transition: 0.3s;

        }


        #searchInput:focus {

            border-color: #6366f1;

            box-shadow:
                0 0 0 4px rgba(99, 102, 241, 0.12);

        }


        #searchInput::placeholder {

            color: #9ca3af;

        }


        /* ------------------------------
           STUDENT LIST
        ------------------------------ */

        #studentList {

            list-style: none;

            display: flex;

            flex-direction: column;

            gap: 10px;

        }


        #studentList li {

            display: flex;

            align-items: center;

            gap: 12px;

            padding: 14px 16px;

            background: #f8fafc;

            border: 1px solid #e5e7eb;

            border-radius: 12px;

            color: #374151;

            font-weight: 500;

            transition: 0.25s;

        }


        #studentList li::before {

            content: "👤";

            width: 35px;

            height: 35px;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #eef2ff;

            border-radius: 50%;

            font-size: 17px;

        }


        #studentList li:hover {

            background: #eef2ff;

            border-color: #c7d2fe;

            transform: translateX(6px);

            box-shadow:
                0 5px 15px rgba(99, 102, 241, 0.12);

        }


        /* ------------------------------
           NO RESULT
        ------------------------------ */

        #noResult {

            display: none;

            text-align: center;

            padding: 15px;

            background: #fef2f2;

            color: #dc2626;

            border-radius: 12px;

            font-weight: bold;

        }


        /* ------------------------------
           ANIMATION
        ------------------------------ */

        @keyframes appear {

            from {

                opacity: 0;

                transform: translateY(20px);

            }

            to {

                opacity: 1;

                transform: translateY(0);

            }

        }


    </style>

</head>


<body>


    <div class="container">


        <!-- BACK BUTTON -->

        <a href="https://github.com/abinaah2004-maker/WebClass/tree/main/week4-1" class="back-link">

            ← Back to Week 4

        </a>


        <!-- TITLE -->

        <h1>

            🎓 Student Search

        </h1>


        <p class="subtitle">

            Search for a student by name

        </p>


        <!-- SEARCH -->

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="🔍  Search student name..."
            >

        </div>


        <!-- STUDENT LIST -->

        <ul id="studentList">

            <li>Abinash Lamichhane</li>

            <li>John Cena</li>

            <li>Brock Lesnar</li>

            <li>Batista</li>

            <li>Sudip Sah</li>

            <li>John Kim</li>

            <li>David Lee</li>

            <li>Sarah Park</li>

            <li>Minji Choi</li>

        </ul>


        <!-- NO RESULT -->

        <p id="noResult">

            ❌ No student found

        </p>


    </div>



    <script>


        /* ------------------------------
           SELECT ELEMENTS
        ------------------------------ */

        const searchInput =
            document.getElementById("searchInput");


        const students =
            document.querySelectorAll("#studentList li");


        const noResult =
            document.getElementById("noResult");



        /* ------------------------------
           SEARCH EVENT
        ------------------------------ */

        searchInput.addEventListener(
            "input",
            function() {


                const searchText =
                    searchInput.value.toLowerCase();


                let found = false;



                /* CHECK EVERY STUDENT */

                students.forEach(
                    function(student) {


                        const studentName =
                            student.textContent.toLowerCase();



                        /* IF NAME MATCHES */

                        if (
                            studentName.includes(searchText)
                        ) {

                            student.style.display =
                                "flex";

                            found = true;

                        }


                        /* IF NAME DOES NOT MATCH */

                        else {

                            student.style.display =
                                "none";

                        }

                    }
                );



                /* NO RESULT MESSAGE */

                if (found) {

                    noResult.style.display =
                        "none";

                }

                else {

                    noResult.style.display =
                        "block";

                }

            }
        );


    </script>


</body>

</html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preventing default behavior | Abinash</title><style>body{margin:0;background:#f1f5f9;color:#172033;font:16px/1.6 system-ui,sans-serif}main{max-width:820px;margin:2rem auto;padding:1.5rem;background:white;border:1px solid #dbe3ef;border-radius:16px}button,input{font:inherit;padding:.6rem;border:1px solid #94a3b8;border-radius:8px}button{background:#1d4ed8;color:white;border:0;cursor:pointer}a{color:#1d4ed8}.panel{padding:1rem;margin:.75rem 0;background:#eff6ff;border-radius:10px}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}</style></head><body><main><p><a href="../index.html">← Week 4 lessons</a> · <a href="../../index.html">Coursework home</a></p><h1>Preventing default behavior</h1><p>preventDefault stops a browser's normal action, such as navigating after a form submit.</p><form id="demo"><label for="name">Your name</label><input id="name" required><button>Submit without reloading</button></form><p id="output" aria-live="polite"></p><h2>Key idea</h2><p>Inspect the HTML and JavaScript, then change one line at a time to see what happens.</p></main><script>document.querySelector("#demo").addEventListener("submit",event=>{event.preventDefault();document.querySelector("#output").textContent="Form handled with JavaScript for "+document.querySelector("#name").value+"; the page did not reload.";});</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selecting elements | Abinash</title><style>body{margin:0;background:#f1f5f9;color:#172033;font:16px/1.6 system-ui,sans-serif}main{max-width:820px;margin:2rem auto;padding:1.5rem;background:white;border:1px solid #dbe3ef;border-radius:16px}button,input{font:inherit;padding:.6rem;border:1px solid #94a3b8;border-radius:8px}button{background:#1d4ed8;color:white;border:0;cursor:pointer}a{color:#1d4ed8}.panel{padding:1rem;margin:.75rem 0;background:#eff6ff;border-radius:10px}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}</style></head><body><main><p><a href="../index.html">← Week 4 lessons</a> · <a href="../../index.html">Coursework home</a></p><h1>Selecting elements</h1><p>Use querySelector to find one element and querySelectorAll to find a group.</p><div class="panel" id="demo">This is the demo text.</div><button id="change">Change selected element</button><p id="output"></p><h2>Key idea</h2><p>Inspect the HTML and JavaScript, then change one line at a time to see what happens.</p></main><script>document.querySelector("#change").addEventListener("click",()=>{const target=document.querySelector("#demo");target.textContent="Selected with querySelector()!";document.querySelector("#output").textContent="querySelector returned the first matching element.";});</script></body></html>

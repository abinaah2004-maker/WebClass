<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reading and writing text | Abinash</title><style>body{margin:0;background:#f1f5f9;color:#172033;font:16px/1.6 system-ui,sans-serif}main{max-width:820px;margin:2rem auto;padding:1.5rem;background:white;border:1px solid #dbe3ef;border-radius:16px}button,input{font:inherit;padding:.6rem;border:1px solid #94a3b8;border-radius:8px}button{background:#1d4ed8;color:white;border:0;cursor:pointer}a{color:#1d4ed8}.panel{padding:1rem;margin:.75rem 0;background:#eff6ff;border-radius:10px}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}</style></head><body><main><p><a href="../index.html">← Week 4 lessons</a> · <a href="../../index.html">Coursework home</a></p><h1>Reading and writing text</h1><p>textContent reads or updates text without interpreting it as HTML.</p><p id="message" class="panel">Original message</p><button id="read">Read text</button><button id="write">Write new text</button><p id="output"></p><h2>Key idea</h2><p>Inspect the HTML and JavaScript, then change one line at a time to see what happens.</p></main><script>document.querySelector("#read").onclick=()=>document.querySelector("#output").textContent="Current text: "+document.querySelector("#message").textContent;document.querySelector("#write").onclick=()=>document.querySelector("#message").textContent="The message was updated using textContent.";</script></body></html>

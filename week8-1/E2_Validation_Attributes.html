<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Validation Attributes | Abinash</title><style>body{margin:0;background:#f1f5f9;color:#172033;font:16px/1.6 system-ui,sans-serif}main{max-width:820px;margin:2rem auto;padding:1.5rem;background:white;border:1px solid #dbe3ef;border-radius:16px}button,input,select,textarea{font:inherit;padding:.6rem;border:1px solid #94a3b8;border-radius:8px;max-width:100%}button{background:#1d4ed8;color:white;border:0;cursor:pointer}a{color:#1d4ed8}.card{padding:1rem;margin:.75rem 0;background:#eff6ff;border-radius:10px}label{display:block;margin:.6rem 0 .2rem;font-weight:650}input:focus-visible,button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}</style></head><body><main><p><a href="index.html">← Back to this week</a> · <a href="../index.html">Coursework home</a></p><h1>Task 2: Validation attributes</h1><p>Try invalid values to see browser-native validation. Fields use required, type, minlength, maxlength, and min/max.</p><form><label for="name">Name (2–40 characters)</label><input id="name" required minlength="2" maxlength="40"><label for="email">Email address</label><input id="email" type="email" required><label for="age">Age (18–120)</label><input id="age" type="number" min="18" max="120" required><label for="website">Portfolio URL (optional)</label><input id="website" type="url" placeholder="https://example.com"><button>Check validity</button></form></main><script></script></body></html>

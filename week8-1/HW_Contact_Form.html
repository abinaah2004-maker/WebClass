<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact Form | Abinash</title><style>body{margin:0;background:#f1f5f9;color:#172033;font:16px/1.6 system-ui,sans-serif}main{max-width:820px;margin:2rem auto;padding:1.5rem;background:white;border:1px solid #dbe3ef;border-radius:16px}button,input,select,textarea{font:inherit;padding:.6rem;border:1px solid #94a3b8;border-radius:8px;max-width:100%}button{background:#1d4ed8;color:white;border:0;cursor:pointer}a{color:#1d4ed8}.card{padding:1rem;margin:.75rem 0;background:#eff6ff;border-radius:10px}label{display:block;margin:.6rem 0 .2rem;font-weight:650}input:focus-visible,button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}</style></head><body><main><p><a href="index.html">← Back to this week</a> · <a href="../index.html">Coursework home</a></p><h1>Task 4: Contact form</h1><p>Practice collecting a name, email, topic, and message. This demo does not send data to a server.</p><form id="form"><label for="name">Your name</label><input id="name" required><label for="email">Email</label><input id="email" type="email" required><label for="topic">Topic</label><select id="topic"><option>Coursework</option><option>Project</option><option>Other</option></select><label for="message">Message (10–500 characters)</label><textarea id="message" minlength="10" maxlength="500" required rows="5"></textarea><button>Review message</button></form><p id="status" role="status"></p></main><script>document.querySelector("#form").onsubmit=e=>{e.preventDefault();document.querySelector("#status").textContent="Thanks, "+document.querySelector("#name").value.trim()+". Your message passed local validation, but was not sent.";};</script></body></html>

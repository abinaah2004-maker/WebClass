<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Validation Styles | Abinash</title><style>body{margin:0;background:#f1f5f9;color:#172033;font:16px/1.6 system-ui,sans-serif}main{max-width:820px;margin:2rem auto;padding:1.5rem;background:white;border:1px solid #dbe3ef;border-radius:16px}button,input,select,textarea{font:inherit;padding:.6rem;border:1px solid #94a3b8;border-radius:8px;max-width:100%}button{background:#1d4ed8;color:white;border:0;cursor:pointer}a{color:#1d4ed8}.card{padding:1rem;margin:.75rem 0;background:#eff6ff;border-radius:10px}label{display:block;margin:.6rem 0 .2rem;font-weight:650}input:focus-visible,button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}</style></head><body><main><p><a href="index.html">← Back to this week</a> · <a href="../index.html">Coursework home</a></p><h1>Task 3: Validation styles</h1><p>CSS can visually distinguish invalid and valid input. Complete all required fields to see the valid state.</p><style>input:required:invalid{border:2px solid #dc2626;background:#fef2f2}input:required:valid{border:2px solid #16a34a;background:#f0fdf4}</style><form><label for="user">Username (3+ characters)</label><input id="user" required minlength="3"><label for="mail">Email</label><input id="mail" type="email" required><button>Submit</button></form></main><script></script></body></html>

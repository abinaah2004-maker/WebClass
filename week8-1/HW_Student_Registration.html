<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Registration | Abinash</title><style>body{margin:0;background:#f1f5f9;color:#172033;font:16px/1.6 system-ui,sans-serif}main{max-width:820px;margin:2rem auto;padding:1.5rem;background:white;border:1px solid #dbe3ef;border-radius:16px}button,input,select,textarea{font:inherit;padding:.6rem;border:1px solid #94a3b8;border-radius:8px;max-width:100%}button{background:#1d4ed8;color:white;border:0;cursor:pointer}a{color:#1d4ed8}.card{padding:1rem;margin:.75rem 0;background:#eff6ff;border-radius:10px}label{display:block;margin:.6rem 0 .2rem;font-weight:650}input:focus-visible,button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}</style></head><body><main><p><a href="index.html">← Back to this week</a> · <a href="../index.html">Coursework home</a></p><h1>Task 5: Student registration</h1><p>Practice required fields, date, email, radio buttons, and a consent checkbox. Do not enter real sensitive information into this practice form.</p><form id="form"><label for="name">Full name</label><input id="name" required><label for="email">University email</label><input id="email" type="email" required><label for="dob">Date of birth</label><input id="dob" type="date" required><p>Study level</p><label><input type="radio" name="level" value="undergraduate" required> Undergraduate</label><label><input type="radio" name="level" value="graduate"> Graduate</label><label><input type="checkbox" id="consent" required> I confirm this is practice data.</label><button>Validate registration</button></form><p id="status" role="status"></p></main><script>document.querySelector("#form").onsubmit=e=>{e.preventDefault();document.querySelector("#status").textContent="All required fields are valid. No information was sent or saved.";};</script></body></html>

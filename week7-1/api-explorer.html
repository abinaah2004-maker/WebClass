<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open Library Explorer | Abinash</title><style>body{margin:0;background:#f1f5f9;color:#172033;font:16px/1.6 system-ui,sans-serif}main{max-width:850px;margin:2rem auto;padding:1.5rem;background:white;border:1px solid #dbe3ef;border-radius:16px}button,input{font:inherit;padding:.6rem;border:1px solid #94a3b8;border-radius:8px}button{background:#1d4ed8;color:white;border:0;cursor:pointer}a{color:#1d4ed8}.card{padding:1rem;margin:.75rem 0;background:#eff6ff;border-radius:10px}label{display:block;margin:.6rem 0 .2rem;font-weight:650}</style></head><body><main><p><a href="index.html">← Week 7</a> · <a href="../index.html">Coursework home</a></p><h1>Open Library API explorer</h1><p>Search books by title. Internet required.</p><form id="form"><label for="query">Book title</label><input id="query" required value="Harry Potter"><button>Search books</button></form><p id="status" role="status">Ready to search.</p><section id="results"></section></main><script>const form=document.querySelector("#form"),status=document.querySelector("#status"),results=document.querySelector("#results");form.onsubmit=async e=>{e.preventDefault();const q=document.querySelector("#query").value.trim();status.textContent="Searching…";results.replaceChildren();try{const r=await fetch("https://openlibrary.org/search.json?title="+encodeURIComponent(q)+"&limit=8");if(!r.ok)throw new Error("HTTP "+r.status);const data=await r.json();if(!data.docs.length){status.textContent="No books found. Try another title.";return;}data.docs.forEach(book=>{const card=document.createElement("article");card.className="card";const h=document.createElement("h2");h.textContent=book.title||"Untitled";const p=document.createElement("p");p.textContent="Author: "+(book.author_name||["Not listed"]).slice(0,3).join(", ")+" · First published: "+(book.first_publish_year||"Unknown");card.append(h,p);results.append(card);});status.textContent="Found "+data.docs.length+" results.";}catch(err){status.textContent="Could not load books. "+err.message;}};</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BookFinder Complete App | Abinash</title><style>body{margin:0;background:#f1f5f9;color:#172033;font:16px/1.6 system-ui,sans-serif}main{max-width:850px;margin:2rem auto;padding:1.5rem;background:white;border:1px solid #dbe3ef;border-radius:16px}button,input{font:inherit;padding:.6rem;border:1px solid #94a3b8;border-radius:8px}button{background:#1d4ed8;color:white;border:0;cursor:pointer}a{color:#1d4ed8}.card{padding:1rem;margin:.75rem 0;background:#eff6ff;border-radius:10px}label{display:block;margin:.6rem 0 .2rem;font-weight:650}</style></head><body><main><p><a href="index.html">← Week 7</a> · <a href="../index.html">Coursework home</a></p><h1>BookFinder</h1><p>Search Open Library and save a reading list in this browser.</p><form id="form"><label for="q">Title or subject</label><input id="q" required value="science fiction"><button>Search</button></form><p id="status" role="status">Search for a book to begin.</p><section id="results"></section><h2>Saved reading list</h2><section id="saved"></section></main><script>const form=document.querySelector("#form"),status=document.querySelector("#status"),results=document.querySelector("#results"),saved=document.querySelector("#saved");let library=JSON.parse(localStorage.getItem("abinashBookList")||"[]");function renderSaved(){saved.replaceChildren();if(!library.length){saved.textContent="No saved books yet.";return;}library.forEach((b,i)=>{const row=document.createElement("article");row.className="card";row.textContent=b.title+" — "+b.author+" ";const del=document.createElement("button");del.textContent="Remove";del.onclick=()=>{library.splice(i,1);localStorage.setItem("abinashBookList",JSON.stringify(library));renderSaved();};row.append(del);saved.append(row);});}form.onsubmit=async e=>{e.preventDefault();status.textContent="Loading…";results.replaceChildren();try{const r=await fetch("https://openlibrary.org/search.json?q="+encodeURIComponent(document.querySelector("#q").value.trim())+"&limit=10");if(!r.ok)throw new Error("HTTP "+r.status);const data=await r.json();if(!data.docs.length){status.textContent="No results found.";return;}data.docs.forEach(b=>{const title=b.title||"Untitled",author=(b.author_name||["Unknown author"])[0];const card=document.createElement("article");card.className="card";const h=document.createElement("h2");h.textContent=title;const p=document.createElement("p");p.textContent=author+" · "+(b.first_publish_year||"Year unknown");const btn=document.createElement("button");btn.textContent="Save book";btn.onclick=()=>{if(!library.some(x=>x.title===title&&x.author===author)){library.push({title,author});localStorage.setItem("abinashBookList",JSON.stringify(library));renderSaved();}};card.append(h,p,btn);results.append(card);});status.textContent="Loaded "+data.docs.length+" books.";}catch(err){status.textContent="Search failed: "+err.message;}};renderSaved();</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hover Card | Abinash</title><style>body{margin:0;background:#f1f5f9;color:#172033;font:16px/1.6 system-ui,sans-serif}main{max-width:820px;margin:2rem auto;padding:1.5rem;background:white;border:1px solid #dbe3ef;border-radius:16px}a{color:#1d4ed8}button{font:inherit;padding:.6rem;border:0;border-radius:8px;background:#1d4ed8;color:white;cursor:pointer}.demo{position:relative;padding:1.5rem;margin:1rem 0;background:#e0f2fe;border-radius:12px}.card{padding:1rem;border:1px solid #cbd5e1;border-radius:12px;background:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem}.spinner{width:28px;height:28px;border:4px solid #cbd5e1;border-top-color:#1d4ed8;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}</style></head><body><main><p><a href="index.html">← CSS assignment index</a> · <a href="../index.html">Coursework home</a></p><h1>Task 2: Hover card transition</h1><p>Hover or focus the card to see the transform transition.</p><style>.hover-card{transition:transform .2s ease,box-shadow .2s ease}.hover-card:hover,.hover-card:focus-visible{transform:translateY(-6px);box-shadow:0 12px 24px #94a3b8}</style><article class="card hover-card" tabindex="0"><h2>Learning CSS</h2><p>Transitions can make state changes feel smooth. Keyboard focus receives the same effect.</p></article></main><script></script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTML Forms | Abinash</title><style>body{font:16px/1.6 system-ui,sans-serif;max-width:780px;margin:2rem auto;padding:0 1rem;color:#172033}label{display:block;margin:.7rem 0 .2rem}input,button,textarea{font:inherit;padding:.5rem;border:1px solid #94a3b8;border-radius:6px}button{cursor:pointer;background:#1d4ed8;color:white}section,article{padding:1rem;background:#eff6ff;border-radius:10px;margin:1rem 0}a{color:#1d4ed8}</style></head><body><p><a href="../index.html">← Coursework home</a></p><h1>HTML forms</h1><p>Forms collect user input. Every field should have a visible label.</p><form><label for="name">Name</label><input id="name" name="name" required><label for="email">Email</label><input id="email" name="email" type="email" required><label for="message">Message</label><textarea id="message" name="message" rows="4"></textarea><button>Validate form</button></form><script></script></body></html>
